<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10MA Course Planner</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1f1e1c;--muted:#6b6a65;--line:#e2e0d8;--accent:#2f5fd0;
--lesson:#eef3fd;--lesson-i:#1d4596;--prac:#e6f5ee;--prac-i:#0f6e56;--sac:#fcebeb;--sac-i:#a32d2d;
--review:#faeeda;--review-i:#854f0b;--other:#f1efe8;--other-i:#5f5e5a}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:17px;font-weight:600;margin:0 12px 0 0}
.tabs button{font:inherit;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs button:disabled{opacity:.45;cursor:default}
main{max-width:1200px;margin:0 auto;padding:16px 20px 80px}
.note{color:var(--muted);font-size:13px;margin:4px 0 14px}
/* chapter card */
.chap{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--lesson-i);border-radius:14px;padding:16px 18px;margin-bottom:18px}
.chap-h{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;cursor:pointer}
.chap-h h2{margin:0;font-size:19px}
.chap-h .meta{color:var(--muted);font-size:12px;margin-top:3px}
.chap-body{margin-top:14px}
.chap-ov{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;background:#fbfaf6;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.chap-ov h3,.detail h3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 6px}
.chap-ov ul{margin:0;padding-left:0;list-style:none;line-height:1.5}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:600}
/* subchapter grid */
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c,var(--lesson-i));border-radius:10px;padding:9px 11px;cursor:pointer;min-height:84px;display:flex;flex-direction:column;gap:5px}
.card:hover{border-color:var(--muted);border-left-color:var(--c,var(--lesson-i))}
.card.open{outline:2px solid var(--accent)}
.card .top{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.card .ttl{font-weight:500;line-height:1.3}
.card .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto}
.tag{font-size:11px;padding:1px 7px;border-radius:6px;background:var(--b,var(--other));color:var(--tc,var(--other-i))}
.tag.t10a{--b:var(--sac);--tc:var(--sac-i);font-weight:600}
.tag.tcons{--b:var(--review);--tc:var(--review-i)}
.tag.tidx{--b:var(--lesson);--tc:var(--lesson-i)}
.card.is10a{--c:var(--sac-i)}
/* detail */
.detail{grid-column:1/-1;background:var(--card);border:1px solid var(--accent);border-radius:12px;padding:16px 18px}
.detail h2{font-size:17px;margin:0}
.detail .sub{color:var(--muted);font-size:12px;margin:3px 0 12px}
.flow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sec{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fdfcf9}
.sec.wide{grid-column:1/-1}
.sec .step{display:inline-block;font-size:11px;font-weight:600;color:#fff;background:var(--ink);border-radius:5px;padding:1px 6px;margin-right:6px}
.sec h3{display:flex;align-items:center;margin-bottom:8px}
.sec ul,.sec ol{margin:0;padding-left:18px;line-height:1.5}
.sec li{margin-bottom:3px}
.src{color:var(--muted);font-size:12px}
.loc{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--other);border-radius:4px;padding:0 4px}
.slot{font-size:11px;font-weight:600;color:var(--lesson-i)}
.vocab{display:flex;flex-wrap:wrap;gap:6px}.vocab span{border:1px solid var(--line);border-radius:14px;padding:2px 10px;background:#fff}
a{color:var(--accent)}
.empty{color:var(--muted);font-style:italic}
.ex{columns:2;column-gap:20px}
@media(max-width:800px){.flow,.chap-ov{grid-template-columns:1fr}.ex{columns:1}}
</style>
</head>
<body>
<header>
  <h1>10MA Course Planner</h1>
  <div class="tabs">
    <button class="on">Library · C10</button>
    <button disabled title="Not indexed yet">Library · G11</button>
    <button disabled title="Coming next">10MAG plan</button>
    <button disabled title="Coming next">10MAA plan</button>
  </div>
</header>
<main>
  <p class="note">Test run: Chapter 1 of Cambridge Essential Mathematics 10 &amp; 10A (3rd ed). Click the chapter to open it, then a subchapter for its lesson plan. Page numbers are printed (book) pages unless marked PDF.</p>
  <div id="lib">Loading…</div>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SEC={building_understanding:'Building understanding',fluency:'Fluency',problem_solving:'Problem-solving',reasoning:'Reasoning',enrichment:'Enrichment'};
let DATA,openSub=null;
fetch('../library/C10.json').then(r=>r.json()).then(d=>{DATA=d;render()}).catch(e=>{document.getElementById('lib').textContent='Could not load library/C10.json: '+e});

function render(){
  const el=document.getElementById('lib');
  el.innerHTML=DATA.chapters.map(ch=>chapter(ch)).join('');
  el.querySelectorAll('.chap-h').forEach(h=>h.onclick=()=>{h.parentNode.classList.toggle('shut');const b=h.parentNode.querySelector('.chap-body');b.hidden=!b.hidden});
  el.querySelectorAll('.card').forEach(c=>c.onclick=()=>{openSub=openSub===c.dataset.id?null:c.dataset.id;render()});
}
function chapter(ch){
  const s=ch.subchapters, n10a=s.filter(x=>x.tenA).length;
  const codes=ch.vc2_codes.map(c=>`<li><span class="code">${c.code}</span> ${c.tenA?'<span class="tag t10a">10A</span>':c.level==='9'?'<span class="tag">Level 9 review</span>':''} ${esc(c.text)}</li>`).join('');
  const res=ch.chapter_resources.map(r=>`<li>${esc(r.name)} <span class="src">p. ${r.printed_page}</span></li>`).join('');
  let grid='';
  s.forEach((x,i)=>{
    grid+=card(x);
    // put the detail panel after the row containing the open card: simplest = right after the card
    if(openSub===x.id) grid+=detail(x);
  });
  return `<section class="chap">
   <div class="chap-h"><div><h2>Chapter ${ch.chapter} · ${esc(ch.title)}</h2>
   <div class="meta">${esc(ch.id)} · ${s.length} subchapters (${n10a} are 10A) · pp. ${s[0].printed_page}–${s[s.length-1].printed_end}</div></div>
   <span class="tag tidx">indexed</span></div>
   <div class="chap-body">
    <div class="chap-ov"><div><h3>Victorian Curriculum 2.0</h3><ul>${codes}</ul></div>
    <div><h3>Chapter resources</h3><ul>${res}</ul></div></div>
    <div class="subs">${grid}</div>
   </div></section>`;
}
function card(x){
  return `<div class="card ${x.tenA?'is10a':''} ${openSub===x.id?'open':''}" data-id="${x.id}">
   <div class="top"><b>${x.sub}</b><span>pp. ${x.printed_page}–${x.printed_end}</span></div>
   <div class="ttl">${esc(x.title)}</div>
   <div class="tags">${x.tenA?'<span class="tag t10a">10A</span>':''}${x.consolidating?'<span class="tag tcons">Consolidating</span>':''}
   <span class="tag">${x.examples.length} examples</span><span class="tag">${x.success_criteria.length} skills</span></div></div>`;
}
function detail(x){
  const li=a=>a.length?'<ul>'+a.join('')+'</ul>':'<p class="empty">None yet</p>';
  const S=(n,t,body,wide)=>`<div class="sec ${wide?'wide':''}"><h3><span class="step">${n}</span>${t}</h3>${body}</div>`;
  const vc=li(x.vc2.map(c=>`<li><span class="code">${c.code}</span> ${c.tenA?'<span class="tag t10a">10A</span> ':''}${c.level==='9'?'<span class="tag">Level 9 review</span> ':''}${esc(c.text)}</li>`));
  const apk=li(x.apk.map(a=>`<li><b>${esc(a.book)}</b> ${esc(a.skill)}<br><span class="src">e.g. <span class="loc">${esc(a.question_locator)}</span> · ${esc(a.src)} #${a.n} (${a.sub}), PDF p. ${a.pdf_page}</span></li>`));
  const dn=li(x.do_now.map(d=>`<li><span class="slot">${esc(d.slot)}</span> · ${esc(d.sub)} — ${esc(d.src)} Q${d.q} <span class="src">(${d.printed_page?'p. '+d.printed_page:'PDF p. '+d.pdf_page})${d.note?' · '+esc(d.note):''}</span></li>`));
  const lis=li(x.learning_intentions.map(t=>`<li>${esc(t)}</li>`));
  const ex=li(x.examples.map(e=>`<li><b>Example ${e.n}</b> ${esc(e.title)}</li>`)).replace('<ul>','<ul class="ex">');
  const exr=li(x.exercise.map(e=>`<li><b>${SEC[e.section]||e.section}</b>${e.title?' · '+esc(e.title):''} Q${esc(e.q)}${e.pathways?` <span class="src">(pathways: ${e.pathways.map(esc).join(' | ')})</span>`:''}</li>`));
  const exit=li(x.exit_tasks.map(e=>`<li>☐ ${esc(e.skill)}<br><span class="src">e.g. <span class="loc">${esc(e.question_locator)}</span> · checklist #${e.n}, p. ${e.printed_page}</span></li>`));
  const sc=li(x.success_criteria.map(s=>`<li>☐ ${esc(s.text)}</li>`));
  const voc=x.key_vocab.length?`<div class="vocab">${x.key_vocab.map(v=>`<span>${esc(v)}</span>`).join('')}</div><p class="src">${esc(x.key_vocab_note)}</p>`:'<p class="empty">None found</p>';
  const vid=x.videos.length?li(x.videos.map(v=>`<li><a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.title)}</a></li>`)):'<p class="empty">None found yet: add one</p>';
  return `<div class="detail"><h2>${x.sub} ${esc(x.title)} ${x.tenA?'<span class="tag t10a">10A</span>':''}</h2>
   <div class="sub">${x.id} · Cambridge 10 &amp; 10A pp. ${x.printed_page}–${x.printed_end} (PDF ${x.pdf_page}–${x.pdf_end}) · status: ${x.status}</div>
   <div class="flow">
    ${S(1,'Learning intentions',lis)}
    ${S(2,'Victorian Curriculum 2.0',vc)}
    ${S(3,'Do Now (retrieval)',dn)}
    ${S(4,'APK (priming: Year 7 → 8 → 9)',apk)}
    ${S(5,'Key vocabulary',voc)}
    ${S(6,'Self-study videos',vid)}
    ${S(7,'Worked examples',ex)}
    ${S(8,'Exercise '+x.sub,exr)}
    ${S(9,'Exit tasks (skills checklist questions)',exit,true)}
    ${S(10,'Success criteria (end-of-lesson skills checklist)',sc,true)}
   </div></div>`;
}
</script>
</body>
</html>
