<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10MA Course Planner</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1f1e1c;--muted:#6b6a65;--line:#e2e0d8;--accent:#2f5fd0;
--lesson:#eef3fd;--lesson-i:#1d4596;--prac:#e6f5ee;--prac-i:#0f6e56;--sac:#fcebeb;--sac-i:#a32d2d;
--review:#faeeda;--review-i:#854f0b;--other:#f1efe8;--other-i:#5f5e5a;--g11:#6b3fa0;--g11b:#f2ecfa}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;height:100vh;display:flex;flex-direction:column}
header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;font-weight:600;margin:0 8px 0 0}
header .save{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}
button,select,input{font:inherit}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.cols{flex:1;display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:14px;padding:14px 16px;min-height:0}
.col{display:flex;flex-direction:column;min-height:0;background:#efede6;border-radius:14px;border:1px solid var(--line)}
.colh{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.colh h2{margin:0;font-size:15px}.colh span{color:var(--muted);font-size:12px}
.colb{overflow:auto;padding:10px;flex:1}
.chap{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--bk);border-radius:12px;margin-bottom:9px}
.chap.C10{--bk:var(--lesson-i)}.chap.G11{--bk:var(--g11)}
.chap-h{padding:9px 11px;display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.chap-h .caret{color:var(--muted);width:12px;transition:transform .15s}
.chap.open .caret{transform:rotate(90deg)}
.chap-h .t{flex:1}.chap-h b{font-size:14px}
.chap-h .m{color:var(--muted);font-size:11px;margin-top:2px}
.chap-b{padding:0 11px 11px;display:none}.chap.open .chap-b{display:block}
.mini{border:1px solid var(--line);border-radius:9px;margin-bottom:7px;background:#fbfaf6}
.mini>summary{cursor:pointer;padding:6px 10px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;list-style:none}
.mini>summary::-webkit-details-marker{display:none}
.mini>summary::before{content:'▸ '}.mini[open]>summary::before{content:'▾ '}
.mini ul{margin:0;padding:0 10px 8px 10px;list-style:none;font-size:12.5px;line-height:1.45}
.mini li{margin-bottom:3px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;font-weight:600}
.sc{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--bk);border-radius:8px;padding:6px 9px;margin-bottom:5px;cursor:grab;display:flex;gap:8px;align-items:center}
.sc:hover{border-color:var(--muted);border-left-color:var(--bk)}
.sc.is10a{border-left-color:var(--sac-i)}
.sc .id{font-weight:700;font-size:12px;min-width:30px}
.sc .tt{flex:1;line-height:1.25;font-size:13px}
.sc .used{font-size:10.5px;color:var(--prac-i);font-weight:600}
.tag{font-size:10.5px;padding:1px 6px;border-radius:6px;background:var(--b,var(--other));color:var(--tc,var(--other-i));white-space:nowrap}
.t10a{--b:var(--sac);--tc:var(--sac-i);font-weight:600}.tcons{--b:var(--review);--tc:var(--review-i)}.tfull{--b:var(--prac);--tc:var(--prac-i)}.text{--b:var(--g11b);--tc:var(--g11)}
.dragall{font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:2px 7px;cursor:grab;white-space:nowrap}
.unit{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;border-top:4px solid var(--ink)}
.unit.over{outline:2px dashed var(--accent);background:#f4f7ff}
.uh{padding:9px 11px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.uh .num{font-weight:700;color:var(--muted)}
.uh input.name{flex:1;min-width:150px;border:1px solid transparent;border-radius:6px;padding:3px 6px;font-weight:600;font-size:14px}
.uh input.name:hover,.uh input.name:focus{border-color:var(--line)}
.uh select{border:1px solid var(--line);border-radius:6px;padding:2px 4px;font-size:12px}
.stream{font-size:11px;border:1px solid var(--line);border-radius:12px;padding:2px 8px;cursor:pointer;background:#fff;color:var(--muted)}
.stream.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ub{padding:0 11px 10px}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:8px;text-align:center;color:var(--muted);font-size:12px;margin-top:4px}
.ui{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:6px;border-left:4px solid var(--bk);background:#fbfaf6;margin-bottom:3px;font-size:13px;cursor:grab}
.ui.C10{--bk:var(--lesson-i)}.ui.G11{--bk:var(--g11)}
.ui .id{font-weight:700;font-size:12px;min-width:56px}.ui .tt{flex:1;line-height:1.2;cursor:pointer}
.ui input{width:44px;border:1px solid var(--line);border-radius:5px;padding:1px 4px;text-align:center}
.x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:15px;padding:0 3px}
.x:hover{color:var(--sac-i)}
.utot{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:6px 2px 2px}
.utot b{color:var(--ink)}
.uinfo{margin-top:6px}
.ulists{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ulists.one{grid-template-columns:1fr}
.ulist{min-width:0}.ulh{display:flex;align-items:center;gap:8px;margin-bottom:8px}.ulh b{font-size:14px}.ulh .src{flex:1}
.unit.sG{border-top-color:#2f7d5b}.unit.sA{border-top-color:var(--sac-i)}
.urow{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}.urow select{border:1px solid var(--line);border-radius:6px;padding:1px 3px;font-size:12px}
.ulist .ui{font-size:12px;gap:5px;padding:3px 5px}.ulist .ui .id{min-width:auto;font-size:11px}
.vers{display:grid;grid-template-columns:1fr 1fr;gap:8px}.vers.one{grid-template-columns:1fr}
.ver{border:1px solid var(--line);border-radius:9px;padding:6px;background:#fdfcf9;min-width:0}
.ver.over{outline:2px dashed var(--accent);background:#f4f7ff}
.ver.off{display:flex;align-items:center;justify-content:center;border-style:dashed;background:none;min-height:60px}
.vh{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}.vh select{border:1px solid var(--line);border-radius:6px;padding:1px 3px;font-size:11.5px}.vh b{font-size:12px;flex:1}
.vfoot{font-size:11px;color:var(--muted);padding:4px 2px 0}
.ui.only{background:#fff7e0}
.ver .ui{font-size:12px;gap:5px;padding:3px 5px}.ver .ui .id{min-width:auto;font-size:11px}
.lesbox{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap}.lesbox input{width:52px;border:1px solid var(--line);border-radius:6px;padding:2px 4px;text-align:center;font-weight:600;color:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(30,30,28,.35);display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow:auto;z-index:20}
.modal.on{display:flex}
.detail{background:var(--card);border-radius:14px;max-width:1000px;width:100%;padding:18px 20px;position:relative}
.detail h2{font-size:18px;margin:0 70px 0 0}.detail .sub{color:var(--muted);font-size:12px;margin:3px 0 12px}
.detail .close{position:absolute;top:12px;right:14px}
.flow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sec{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fdfcf9}.sec.wide{grid-column:1/-1}
.sec h3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px;display:flex;align-items:center}
.sec .step{display:inline-block;font-size:11px;font-weight:600;color:#fff;background:var(--ink);border-radius:5px;padding:1px 6px;margin-right:6px}
.sec ul{margin:0;padding-left:18px;line-height:1.5}.sec li{margin-bottom:3px}
.src{color:var(--muted);font-size:12px}.loc{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--other);border-radius:4px;padding:0 4px}
.slot{font-size:11px;font-weight:600;color:var(--lesson-i)}
.vocab{display:flex;flex-wrap:wrap;gap:6px}.vocab span{border:1px solid var(--line);border-radius:14px;padding:2px 10px;background:#fff}
.empty{color:var(--muted);font-style:italic}
.rp li{margin-bottom:6px}.hwo{border-collapse:collapse;font-size:13px}.hwo th,.hwo td{border:1px solid var(--line);padding:4px 9px;text-align:left}.hwo th{background:#f4f2ec}.rp .mc{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:3px}
.tabs{display:flex;gap:4px;background:var(--other);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;padding:5px 14px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
body:not(.tab-units) .cols,body:not(.tab-units) #hint,body:not(.tab-y27) #year,body:not(.tab-les) #lessons{display:none}
#lessons{flex:1;overflow:auto;padding:14px 16px}
.lu .lh{cursor:pointer}.lu .caret{color:var(--muted)}
.lrow{display:flex;gap:8px;align-items:flex-start;border-top:1px solid var(--line);padding:5px 2px}.lrow.over{background:#f4f7ff;outline:2px dashed var(--accent)}
.lrow.review{background:#fdf7ec}.lrow.practice{background:#f1f6fd}.lrow.practice .lk{color:var(--lesson-i);font-weight:600}.lrow.practice .lc{opacity:.75}.lrow.assess{background:#fcf1f1}
.ln{font-weight:700;width:34px;flex:none;padding-top:3px}.lk{font-size:11px;color:var(--muted);width:78px;flex:none;padding-top:4px}
.lrow.assess .lk{color:var(--sac-i);font-weight:600}.lrow.review .lk{color:var(--review-i);font-weight:600}
.lch{flex:1;display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-width:0}
.lc{display:inline-flex;align-items:center;gap:4px;border-left:4px solid var(--lesson-i);background:#fbfaf6;border-radius:6px;padding:2px 4px 2px 7px;font-size:12.5px;cursor:grab;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.lc.G11{border-left-color:var(--g11)}.lc .tt{cursor:pointer}.lc .tt:hover{text-decoration:underline}.lc i{font-style:normal;font-size:10.5px;background:var(--review);color:var(--review-i);border-radius:5px;padding:0 5px}
.lnote{border:1px solid transparent;border-radius:5px;padding:2px 5px;font-size:12px;color:var(--muted);min-width:120px;flex:1;background:transparent}.lnote:hover,.lnote:focus{border-color:var(--line);background:#fff}
.lbtn{flex:none;white-space:nowrap}.loose{margin-top:8px;padding:8px;border:1.5px dashed var(--sac-i);border-radius:8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px}
.cfs{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;margin-bottom:8px;padding:8px;background:#f5f0fb;border-radius:9px}.cft{width:100%;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--g11)}
.cf{background:#fff;border:1px solid #d9cdee;border-radius:8px;padding:5px 7px;display:flex;flex-direction:column;gap:3px;min-width:170px;max-width:300px;flex:1}.cf.over{outline:2px dashed var(--accent)}
.cf.new{justify-content:center;color:var(--muted);font-size:12px;border-style:dashed;flex:0 0 170px}.cfn{font-weight:700;font-size:12.5px;color:var(--g11);display:flex;gap:2px;align-items:center}.cfn button:first-of-type{margin-left:auto}
.cc{font-size:11.5px;line-height:1.25;cursor:grab;display:flex;gap:4px;align-items:baseline}.cc .x{font-size:12px;margin-left:auto}.cfmiss{width:100%;font-size:12px;color:var(--sac-i);font-weight:600}
.mats .btn,.umat .pill{text-decoration:none;font-size:12.5px;padding:3px 11px;border-radius:9px;border:1px solid #b9d3cf;color:#1d5a52;background:#fff;font-weight:600}.mats .btn:hover,.umat .pill:hover{background:#eef7f5}.umat{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;padding:8px;background:#eef3fd;border-radius:9px;font-size:12.5px}.umat .cft{color:var(--lesson-i)}.umat a{text-decoration:none}.umat .pill{border:1px solid var(--line);background:#fff;border-radius:7px;padding:2px 8px}
.dnl{width:100%;font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}.dnl a{text-decoration:none;font-weight:600;color:#1d5a52}.dnl .q{background:#eef7f5;border-radius:5px;padding:0 5px;cursor:help}
.cmark{margin:2px 0 4px 42px;padding:4px 10px;border-radius:6px;background:var(--g11b);color:var(--g11);font-size:12px;border-left:4px solid var(--g11)}
.lc em{font-style:normal;font-size:10px;font-weight:700;color:var(--g11);background:var(--g11b);border-radius:4px;padding:0 4px}
#year{flex:1;overflow:auto;padding:14px 16px}
.ybar{position:sticky;top:-14px;z-index:5;background:var(--bg);padding:6px 0 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cls{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 12px;cursor:pointer;font-size:13px}
.cls.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cls i{font-style:normal;font-size:10.5px;font-weight:700;margin-left:4px;padding:0 5px;border-radius:5px;background:#e3f1ea;color:#2f7d5b}
.cls i.A{background:var(--sac);color:var(--sac-i)}.cls.on i{background:rgba(255,255,255,.2);color:#fff}
.ysum{font-size:12px;color:var(--muted);margin:0 0 10px}.ysum b{color:var(--ink)}
.blk{border-radius:14px;margin-bottom:12px;border:1px solid var(--line);background:#efede6}
.blk>summary{list-style:none;cursor:pointer;padding:8px 14px;display:flex;gap:10px;align-items:baseline;color:var(--muted);font-size:13px}
.blk>summary::-webkit-details-marker{display:none}
.blk>summary::before{content:'▸';width:12px}.blk[open]>summary::before{content:'▾'}
.blk.term{background:var(--card);border:2px solid var(--ink)}
.blk.term>summary{background:var(--ink);color:#fff;border-radius:11px 11px 0 0;padding:11px 16px;font-size:16px}
.blk.term:not([open])>summary{border-radius:11px}
.blk.term>summary b{font-size:18px}.blk.term>summary span{opacity:.75;font-size:13px}
.blk.su{border:2px solid #2f7d5b}.blk.su>summary{background:#2f7d5b;color:#fff;border-radius:11px 11px 0 0;font-size:15px;padding:10px 16px}
.blk.su:not([open])>summary{border-radius:11px}
.blkb{padding:10px 12px}
.wk{display:grid;grid-template-columns:62px repeat(5,minmax(0,1fr)) 34px 34px;gap:6px;margin-bottom:6px}
.wkl{font-size:11px;color:var(--muted);padding-top:6px;line-height:1.3}.wkl b{display:block;color:var(--ink);font-size:13px}
.wkl button{margin-top:4px;font-size:10.5px;padding:1px 5px;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:pointer;color:var(--muted);display:block;width:100%}
.wkl button:hover{color:var(--ink);border-color:var(--muted)}
.day{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:5px 6px;min-width:0;min-height:40px}
.day.we{background:#e9e7df;border-style:dashed;padding:4px 2px;text-align:center;font-size:10px;color:var(--muted)}
.day.off{background:repeating-linear-gradient(45deg,#f3f1ea,#f3f1ea 6px,#ebe9e1 6px,#ebe9e1 12px)}
.day.hol{background:#f3f1ea;color:var(--muted)}
.day.out{visibility:hidden}
.dh{font-size:11.5px;font-weight:600;display:flex;justify-content:space-between;gap:4px;cursor:pointer;margin-bottom:3px}
.dh span{color:var(--muted);font-weight:400}.dh .why{color:var(--sac-i);font-weight:600}
.ses{display:flex;gap:4px;align-items:center;border-top:1px solid var(--line);padding:3px 0;min-height:24px;font-size:11.5px}
.ses .p{font-size:10px;color:var(--muted);width:12px;flex:none}
.ses.click{cursor:pointer;border-radius:5px}.ses.click:hover{background:#f4f7ff}
.les{flex:1;min-width:0;border-radius:5px;padding:2px 5px;line-height:1.2;background:#e3f1ea;color:#1d5a40;overflow:hidden}
.les.A{background:var(--sac);color:var(--sac-i)}.les.none{background:var(--other);color:var(--muted)}
.les small{display:block;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ses .add{color:#c9c6bb;font-size:12px}
.chip{font-size:10px;padding:1px 5px;border-radius:5px;background:#e3f1ea;color:#1d5a40;white-space:nowrap}.chip.A{background:var(--sac);color:var(--sac-i)}
.chip.clash{outline:2px solid #d33}
.holgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px}
.holgrid .day{min-height:0;font-size:11px;padding:3px 5px}
a{color:var(--accent)}
/* Lesson planning: course-plan view (look + behaviour copied from the 12MAG planner) */
.cp{max-width:1200px;margin:0 auto}
.cp .aos{margin:22px 0 8px;padding:6px 0;border-top:2px solid var(--ink);display:flex;justify-content:space-between;gap:12px}.cp .aos b{font-size:15px}.cp .aos span{color:var(--muted)}
.cp .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:2px 0 6px}.cp .legend span{display:flex;gap:5px;align-items:center}.cp .legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.chgrid{display:grid;grid-template-columns:110px minmax(0,1.6fr) minmax(0,1fr);gap:10px;align-items:start;margin-bottom:14px}
.wl{padding-top:6px;color:var(--muted);font-size:12px}.wl b{display:block;color:var(--ink);font-size:14px}.wl .cn{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.pcol{display:flex;flex-direction:column;gap:6px}.pcolh{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:9px 11px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.card:hover{border-color:var(--muted);border-left-color:var(--c)}.card.open{outline:2px solid var(--accent)}
.card .meta{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}.card .ttl{font-weight:500;line-height:1.3}.card .tags{display:flex;gap:4px}
.card .tag{font-size:11px;padding:1px 7px;border-radius:6px;background:var(--b);color:var(--c)}
.t-teach{--c:var(--lesson-i);--b:var(--lesson)}.t-practice{--c:var(--prac-i);--b:var(--prac)}.t-review{--c:var(--review-i);--b:var(--review)}.t-assess{--c:var(--sac-i);--b:var(--sac)}.t-cfat{--c:#8a6ad8;--b:#efe9fb}
.card.has-cfat{box-shadow:inset 0 -3px 0 #8a6ad8}.card .tag.cfat{background:#efe9fb;color:#5b3fb0;font-weight:600}
.card.fa{cursor:default}.card.fa a{text-decoration:none;font-size:12px;border:1px solid #9fd3c9;color:#1d7266;border-radius:6px;padding:1px 8px;margin-right:4px;font-weight:600}
.pdetail{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:1fr;gap:10px}
.pdetail h2{font-size:17px;margin:0 0 2px}.pdetail .meta{font-size:11px;color:var(--muted)}
.nest{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--card)}
.nest>summary{list-style:none;cursor:pointer;padding:9px 12px;display:flex;align-items:center;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}

<body>

</div>
<div id="lessons"></div><div id="year"></div>

<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='10ma-units-v1', STREAMS=['10MAG','10MAA'], ASSESS=['','CAT','Topic test','CFATs only','Extension','Exam revision'];
const SECN={building_understanding:'Building understanding',fluency:'Fluency',problem_solving:'Problem-solving',reasoning:'Reasoning',enrichment:'Enrichment'};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}};
let LIB={},IDX={},UNITS=null,openChaps=new Set(JSON.parse(store.get('10ma-open')||'[]')),openUnits=new Set(),filt='';

const BUST=Date.now().toString(36); // always fetch the latest materials
const LKEY='10ma-lessons-v1',LFILE='courses/lessons.json';
const REPO='roccatalano/10MA',FILE='courses/units.json',TTFILE='courses/timetable.json',TTKEY='10ma-tt-v1';
const apiOf=f=>`https://api.github.com/repos/${REPO}/contents/${f}`;
let FF={},FFB={},MOD={sheets:{},approved:{},notes:{}},modDirty=false;const MKEY='10ma-mod-v1',MFILE='courses/modified.json';
let CLOG={decisions:[],rules:[],open:[]},clDirty=false;const CKEY='10ma-cfatlog-v1',CFILE='courses/cfat-log.json';
let dirty=false,ttDirty=false,Y=null,TT=null,LP=null,lpDirty=false;
const b64e=s=>btoa(unescape(encodeURIComponent(s))), b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
async function loadRepo(file,fallback){
  const tok=store.get('10ma-gh');
  if(tok){try{const r=await fetch(apiOf(file)+'?ref=main&t='+Date.now(),{headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'}});if(r.ok){const j=await r.json();return JSON.parse(b64d(j.content))}}catch(e){}}
  try{const r=await fetch('../'+file+'?t='+Date.now());if(r.ok)return r.json()}catch(e){}
  return fallback;
}
Promise.all([fetch('../library/C10.json').then(r=>r.json()),fetch('../library/G11.json').then(r=>r.json()),loadRepo(FILE,{units:[]}),
  fetch('../courses/years/2027.json?t='+Date.now()).then(r=>r.json()),loadRepo(TTFILE,{classes:[],days_off:{},slots:{}}),loadRepo(LFILE,{plans:{}}),loadRepo(CFILE,{decisions:[],rules:[],open:[]}),loadRepo(MFILE,{sheets:{},approved:{},notes:{}}),fetch('../courses/freefall.json?t='+Date.now()).then(r=>r.json()).catch(()=>({books:{},sheets:[]}))])
.then(([c10,g11,units,yr,tt,lp,cl,md,ff])=>{
  {const lm=store.get(MKEY);MOD=lm?JSON.parse(lm):md;MOD.sheets=MOD.sheets||{};MOD.approved=MOD.approved||{};modDirty=!!lm;FFB=ff.books||{};(ff.sheets||[]).forEach(x=>FF[x.id]=x)}
  {const lc=store.get(CKEY);CLOG=lc?JSON.parse(lc):cl;clDirty=!!lc}
  {const ll=store.get(LKEY);LP=ll?JSON.parse(ll):lp;LP.plans=LP.plans||{};lpDirty=!!ll;
   // material links always come from GitHub (a browser draft may predate them); CFATs too if the draft has none
   LP.materials=lp.materials||{};if(!LP.cfats&&lp.cfats)LP.cfats=lp.cfats}
  LIB={C10:c10,G11:g11};Y=yr;
  for(const b of [c10,g11]) if(b) for(const ch of b.chapters){ch.book=b.book.id;for(const s of ch.subchapters){s.book=b.book.id;s.chapter=ch.chapter;IDX[s.id]=s}}
  const local=store.get(KEY);
  UNITS=migrate(local?JSON.parse(local):units);dirty=!!local;
  const lt=store.get(TTKEY);TT=lt?JSON.parse(lt):tt;ttDirty=!!lt;
  TT.slots=TT.slots||{};TT.days_off=TT.days_off||{};
  status();renderLib();renderUnits();
  setTab(store.get('10ma-tab')||'units');
});
function status(msg){const tok=store.get('10ma-gh'),d=dirty||ttDirty||lpDirty||clDirty||modDirty;
  setSaved(msg||(d?'Unsaved changes (kept in this browser)':(tok?'All saved to GitHub':'Up to date with GitHub')));
  const b=document.getElementById('gh');b.disabled=!d;b.style.opacity=d?1:.45;}
async function putGH(file,data,msg,H){
  let sha;const g=await fetch(apiOf(file)+'?ref=main&t='+Date.now(),{headers:H});if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw new Error('GitHub said '+g.status+(g.status===401?' (key wrong or expired)':''));
  const body={message:msg,content:b64e(JSON.stringify(data,null,1)+'\n'),branch:'main'};if(sha)body.sha=sha;
  const p=await fetch(apiOf(file),{method:'PUT',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!p.ok){const j=await p.json().catch(()=>({}));throw new Error('GitHub said '+p.status+': '+(j.message||''))}
}
async function saveGH(){
  let tok=store.get('10ma-gh');if(!tok){askKey();tok=store.get('10ma-gh');if(!tok)return}
  status('Saving to GitHub…');
  const H={Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'};
  try{
    if(dirty){await putGH(FILE,UNITS,'Update unit plan from planner page',H);try{localStorage.removeItem(KEY)}catch(_){}dirty=false}
    if(ttDirty){await putGH(TTFILE,TT,'Update 2027 timetable from planner page',H);try{localStorage.removeItem(TTKEY);localStorage.removeItem(LKEY)}catch(_){}ttDirty=false}
    if(modDirty){await putGH(MFILE,MOD,'Update 10MAG Modified Freefall mapping from planner page',H);try{localStorage.removeItem(MKEY)}catch(_){}modDirty=false}
    if(clDirty){await putGH(CFILE,CLOG,'Update CFAT decisions log from planner page',H);try{localStorage.removeItem(CKEY)}catch(_){}clDirty=false}
    if(lpDirty){await putGH(LFILE,LP,'Update lesson groupings from planner page',H);try{localStorage.removeItem(LKEY)}catch(_){}lpDirty=false}
    status('Saved to GitHub · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
  }catch(e){status('Not saved: '+e.message);alert('Could not save to GitHub.\n\n'+e.message+'\n\nYour changes are still kept in this browser.')}
}
function askKey(){const cur=store.get('10ma-gh');const k=prompt('Paste your GitHub access key (fine-grained token with Contents: read and write on roccatalano/10MA).\nIt is kept only in this browser. Leave blank to remove it.',cur?'(key saved — paste a new one to replace)':'');
  if(k===null||k.startsWith('(key saved'))return;if(k.trim())store.set('10ma-gh',k.trim());else{try{localStorage.removeItem('10ma-gh')}catch(_){}}status()}
document.getElementById('gh').onclick=saveGH;document.getElementById('ghkey').onclick=askKey;
function save(){store.set(KEY,JSON.stringify(UNITS));dirty=true;status();renderUnits();renderLib();if(document.body.classList.contains('tab-y27'))renderYear();if(document.body.classList.contains('tab-les'))renderLessons()}
function saveTT(){store.set(TTKEY,JSON.stringify(TT));ttDirty=true;status();renderYear()}
function setSaved(t){document.getElementById('saved').textContent=t}

function renderLib(){
  for(const [b,el] of [['C10','c10'],['G11','g11']]){
    const L=LIB[b],box=document.getElementById(el),top=box.scrollTop;
    if(!L){box.innerHTML='<p class="empty">Not loaded</p>';continue}
    box.innerHTML=L.chapters.map(ch=>chapterCard(ch,b)).join('');box.scrollTop=top;
  }
  document.querySelectorAll('.chap-h').forEach(h=>h.onclick=e=>{if(e.target.closest('.dragall'))return;const id=h.parentNode.dataset.id;openChaps.has(id)?openChaps.delete(id):openChaps.add(id);store.set('10ma-open',JSON.stringify([...openChaps]));h.parentNode.classList.toggle('open')});
  document.querySelectorAll('.sc').forEach(c=>{c.onclick=()=>showDetail(c.dataset.id);c.ondragstart=e=>e.dataTransfer.setData('text/plain',JSON.stringify({ids:[c.dataset.id]}))});
  document.querySelectorAll('.dragall').forEach(c=>c.ondragstart=e=>e.dataTransfer.setData('text/plain',JSON.stringify({ids:c.dataset.ids.split(',')})));
}
function chapterCard(ch,b){
  const s=ch.subchapters,n10=s.filter(x=>x.tenA).length,id=ch.id||`${b}-Ch${ch.chapter}`;
  const vc=(ch.vc2_codes||[]).length?`<details class="mini"><summary>Victorian Curriculum 2.0 (${ch.vc2_codes.length})</summary><ul>${ch.vc2_codes.map(c=>`<li><span class="code">${c.code}</span> ${c.tenA?'<span class="tag t10a">10A</span> ':''}${c.level==='9'?'<span class="tag">L9 review</span> ':''}${esc(c.text)}</li>`).join('')}</ul></details>`:'';
  const rs=(ch.chapter_resources||[]).length?`<details class="mini"><summary>Chapter resources (${ch.chapter_resources.length})</summary><ul>${ch.chapter_resources.map(r=>`<li>${esc(r.name)} <span class="src">p. ${r.printed_page}</span></li>`).join('')}</ul></details>`:'';
  const pg=s.length?`pp. ${s[0].printed_page}–${s[s.length-1].printed_end}`:'';
  return `<div class="chap ${b} ${openChaps.has(id)?'open':''}" data-id="${id}">
   <div class="chap-h"><span class="caret">▸</span><div class="t"><b>${ch.chapter} · ${esc(ch.title)}</b>
   <div class="m">${s.length} subchapters${n10?` · ${n10} ${n10===1?'is':'are'} 10A`:''} · ${pg} ${ch.status==='full'?'· <span class="tag tfull">full detail</span>':''}</div></div>
   <span class="dragall" draggable="true" data-ids="${s.map(x=>x.id).join(',')}" title="Drag the whole chapter into a unit">⠿ all</span></div>
   <div class="chap-b">${vc}${rs}${s.map(subCard).join('')}</div></div>`;
}
function subCard(x){
  const u=usedIn(x.id);
  return `<div class="sc ${x.tenA?'is10a':''}" draggable="true" data-id="${x.id}" style="--bk:${x.book==='G11'?'var(--g11)':'var(--lesson-i)'}">
   <span class="id">${x.sub}</span><span class="tt">${esc(x.title)}</span>
   ${(x.materials||[]).length?'<span title="Has lesson materials">📄</span>':''}${x.tenA?'<span class="tag t10a">10A</span>':''}${x.consolidating?'<span class="tag tcons">Cons.</span>':''}${x.extension?'<span class="tag text">Ext.</span>':''}
   ${u.length?`<span class="used" title="Used in: ${u.join(', ')} (G = 10MAG unit, A = 10MAA unit)">${u.join(' ')}</span>`:''}</div>`;
}

/* ---------- units: two separate lists, one per stream ---------- */
function migrate(D){
  const out=[];
  (D.units||[]).forEach(u=>{
    if(u.stream){out.push(u);return}
    if(u.versions){STREAMS.forEach(s=>{const v=u.versions[s];if(v)out.push({name:u.name,stream:s,lessons:v.lessons??null,assessment:v.assessment??u.assessment??'',note:u.note||'',items:v.items.map(x=>({id:x.id}))})});return}
    (u.streams||STREAMS).forEach(s=>out.push({name:u.name,stream:s,lessons:u.lessons??null,assessment:u.assessment||'',note:u.note||'',items:(u.items||[]).map(x=>({id:x.id}))}));
  });
  D.units=out;return D;
}
const SH={'10MAG':'G','10MAA':'A'};
function numOf(u){return UNITS.units.filter(x=>x.stream===u.stream).indexOf(u)+1}
function usedIn(id){return UNITS.units.filter(u=>u.items.some(x=>x.id===id)).map(u=>SH[u.stream]+numOf(u))}
function renderUnits(){
  const tot=s=>UNITS.units.filter(u=>u.stream===s).reduce((a,u)=>a+(+u.lessons||0),0);
  document.getElementById('ustat').textContent=`10MAG ${tot('10MAG')} · 10MAA ${tot('10MAA')} × 79-min lessons`;
  const box=document.getElementById('units');
  const shown=filt?[filt]:STREAMS;
  box.className='ulists '+(filt?'one':'');
  box.innerHTML=shown.map(s=>{const us=UNITS.units.map((u,i)=>[u,i]).filter(([u])=>u.stream===s);
    return `<div class="ulist" data-s="${s}"><div class="ulh"><b>${s}</b><span class="src">${us.length} units · ${tot(s)} lessons</span><button class="btn addu" data-s="${s}">+ Unit</button></div>
     ${us.map(([u,i])=>unitCard(u,i)).join('')||'<p class="empty">No units yet</p>'}</div>`}).join('');
  box.querySelectorAll('.addu').forEach(b=>b.onclick=()=>{UNITS.units.push({name:'New unit',stream:b.dataset.s,lessons:null,assessment:'',note:'',items:[]});openUnits.add(UNITS.units.length-1);save()});
  box.querySelectorAll('.unit').forEach(el=>{
    const i=+el.dataset.i,u=UNITS.units[i];
    const sib=()=>UNITS.units.map((x,j)=>[x,j]).filter(([x])=>x.stream===u.stream).map(([,j])=>j);
    el.ondragover=e=>{e.preventDefault();el.classList.add('over')};
    el.ondragleave=e=>{if(!el.contains(e.relatedTarget))el.classList.remove('over')};
    el.ondrop=e=>{e.preventDefault();el.classList.remove('over');let d;try{d=JSON.parse(e.dataTransfer.getData('text/plain'))}catch(_){return}
      if(d.from!=null){if(d.from===i)return;const src=UNITS.units[d.from];const it=src.items[d.idx];
        if(!u.items.some(x=>x.id===it.id))u.items.push({id:it.id});
        if(src.stream===u.stream)src.items.splice(d.idx,1);}   // across streams = copy, same stream = move
      else d.ids.forEach(id=>{if(!u.items.some(x=>x.id===id))u.items.push({id})});
      save()};
    el.querySelector('.name').onchange=e=>{u.name=e.target.value;save()};
    el.querySelector('.assess').onchange=e=>{u.assessment=e.target.value;save()};
    el.querySelector('.les').onchange=e=>{u.lessons=e.target.value===''?null:Math.max(0,+e.target.value||0);save()};
    const n=el.querySelector('.note');if(n)n.onchange=e=>{u.note=e.target.value;save()};
    el.querySelector('.del').onclick=()=>{if(confirm(`Delete ${u.stream} unit "${u.name}"?`)){UNITS.units.splice(i,1);openUnits.clear();save()}};
    el.querySelector('.dup').onclick=()=>{const o=u.stream==='10MAG'?'10MAA':'10MAG';UNITS.units.push({...JSON.parse(JSON.stringify(u)),stream:o});save()};
    el.querySelector('.up').onclick=()=>{const s=sib(),k=s.indexOf(i);if(k>0){const j=s[k-1];[UNITS.units[j],UNITS.units[i]]=[UNITS.units[i],UNITS.units[j]];openUnits.clear();save()}};
    el.querySelector('.dn').onclick=()=>{const s=sib(),k=s.indexOf(i);if(k<s.length-1){const j=s[k+1];[UNITS.units[j],UNITS.units[i]]=[UNITS.units[i],UNITS.units[j]];openUnits.clear();save()}};
    el.querySelector('.tog').onclick=e=>{e.preventDefault();openUnits.has(i)?openUnits.delete(i):openUnits.add(i);renderUnits()};
    el.querySelectorAll('.ui').forEach(r=>{const k=+r.dataset.k;
      r.querySelector('.x').onclick=()=>{u.items.splice(k,1);save()};
      r.querySelector('.tt').onclick=()=>showDetail(u.items[k].id);
      r.ondragstart=e=>e.dataTransfer.setData('text/plain',JSON.stringify({from:i,idx:k}));
      r.ondrop=e=>{let d;try{d=JSON.parse(e.dataTransfer.getData('text/plain'))}catch(_){return}
        if(d.from===i){e.preventDefault();e.stopPropagation();el.classList.remove('over');const it=u.items.splice(d.idx,1)[0];u.items.splice(k,0,it);save()}};
    });
  });
}
function unitCard(u,i){
  const open=openUnits.has(i), items=u.items.map(x=>({...x,s:IDX[x.id]}));
  const L=+u.lessons||0, n10=items.filter(x=>x.s&&x.s.tenA).length;
  const codes=new Map(),chs=new Map();
  items.forEach(x=>{if(!x.s)return;(x.s.vc2||[]).forEach(c=>codes.set(c.code,c));const k=x.s.book+' Ch'+x.s.chapter;chs.set(k,(chs.get(k)||0)+1)});
  const info=open?`<div class="uinfo"><details class="mini" open><summary>Unit summary</summary><ul>
    <li><b>${L||'?'}</b> × 79-min lessons · <b>${items.length}</b> subchapters${items.length&&L?` (≈ ${(L/items.length).toFixed(1)} each)`:''} · ${n10} are 10A</li>
    <li>From: ${[...chs].map(([k,n])=>`${k} (${n})`).join(', ')||'nothing yet'}</li>
    <li><input class="note" placeholder="Notes for this unit…" value="${esc(u.note||'')}" style="width:100%;border:1px solid var(--line);border-radius:6px;padding:3px 6px"></li></ul></details>

          return `<span class="lc ${x.id.split('-')[0]}" draggable="true" data-k="${k}" data-j="${j}"><b>${x.id.startsWith('G11')?'Y11 ':''}${s?.sub||x.id}</b> <span class="tt">${esc(s?.title||'')}</span>${l.kind==='teach'&&cnt[x.id]>1?` <i>${seen[x.id]} of ${cnt[x.id]}</i>`:''}${cfIn[x.id]?`<em title="Assessed in CFAT ${cfIn[x.id]}">C${cfIn[x.id]}</em>`:''}<button class="x sp" title="Split: also teach this in a new lesson straight after">✂</button><button class="x rm" title="Take out of this lesson">✕</button></span>`}).join('')||(l.kind==='teach'?'<span class="empty">Drop a subchapter here</span>':'')}
         <input class="lnote" placeholder="note…" value="${esc(l.note||'')}">${dnLine(DNS[(numOf(u)-1)+'|'+k],u,k)}</div>
        <span class="lbtn"><button class="x up" title="Move up">↑</button><button class="x dn" title="Move down">↓</button><button class="x del" title="Delete lesson">✕</button></span></div>`+cmark(k)}).join('');
      b+=(loose.length?`<div class="loose"><b>Not in a lesson yet:</b> ${loose.map(x=>`<span class="lc ${x.id.split('-')[0]}" draggable="true" data-id="${x.id}"><b>${IDX[x.id]?.sub||x.id}</b> <span class="tt">${esc(IDX[x.id]?.title||'')}</span></span>`).join('')}</div>`:'')
       +`<div class="urow" style="margin-top:8px"><button class="btn addl" data-kind="teach">+ Lesson</button><button class="btn addl" data-kind="practice">+ Practice</button><button class="btn addl" data-kind="review">+ Review</button><button class="btn addl" data-kind="assess">+ Assessment</button>${LP.plans[ukey(u)]?'<button class="btn rst" title="Go back to one lesson per subchapter">Reset</button>':''}</div>`}
    const U=numOf(u);
    return `<div class="unit lu ${u.stream==='10MAA'?'sA':'sG'}" data-i="${i}"><div class="uh lh"><span class="num">${SH[u.stream]}${numOf(u)}</span><b style="flex:1">${esc(u.name)}</b>
      <span class="src">${p.length} lessons (${nt} teaching) · ${u.items.length} subchapters · ${cf.length} CFATs${u.items.some(x=>!cfIn[x.id])?` · <b style="color:var(--sac-i)">${u.items.filter(x=>!cfIn[x.id]).length} not in a CFAT</b>`:''}${loose.length?` · <b style="color:var(--sac-i)">${loose.length} not placed</b>`:''} · Unit planning says ${u.lessons??'?'}</span>
      ${(+u.lessons||0)!==p.length?`<button class="btn uset" title="Set this unit's lesson count on the Unit planning tab to ${p.length}">Use ${p.length}</button>`:''}<span class="caret">${open?'▾':'▸'}</span></div>${open?`<div class="ub">${b}</div>`:''}</div>`}).join('')||'<p class="empty">No units for this stream yet</p>';
  box.innerHTML=h;box.scrollTop=top;wireMode(box);
  box.querySelectorAll('.cls').forEach(b=>b.onclick=()=>{lstream=b.dataset.s;store.set('10ma-lstream',lstream);renderLessons()});
  box.querySelectorAll('.lu').forEach(el=>{const u=UNITS.units[+el.dataset.i],P=()=>JSON.parse(JSON.stringify(planOf(u)));
    el.querySelector('.lh').onclick=e=>{if(e.target.closest('button'))return;const k=ukey(u);openL.has(k)?openL.delete(k):openL.add(k);store.set('10ma-lopen',JSON.stringify([...openL]));renderLessons()};
    const us=el.querySelector('.uset');if(us)us.onclick=()=>{u.lessons=planOf(u).length;save();renderLessons()};
    el.querySelectorAll('.addl').forEach(b=>b.onclick=()=>{const p=P();p.push({kind:b.dataset.kind,items:[],note:''});setPlan(u,p)});
    const r=el.querySelector('.rst');if(r)r.onclick=()=>{if(confirm('Reset this unit to one lesson per subchapter?')){delete LP.plans[ukey(u)];setPlan(u,planOf(u))}};
    el.querySelectorAll('.lc').forEach(c=>{
      c.ondragstart=e=>{e.stopPropagation();e.dataTransfer.setData('text/plain',JSON.stringify({u:+el.dataset.i,k:c.dataset.k,j:c.dataset.j,id:c.dataset.id}))};
      c.querySelector('.tt').onclick=()=>showDetail(c.dataset.id||planOf(u)[+c.dataset.k].items[+c.dataset.j].id);
      const sp=c.querySelector('.sp');if(sp)sp.onclick=()=>{const p=P(),k=+c.dataset.k,x=p[k].items[+c.dataset.j];p.splice(k+1,0,{kind:'teach',items:[{id:x.id}],note:''});setPlan(u,p)};
      const rm=c.querySelector('.rm');if(rm)rm.onclick=()=>{const p=P();p[+c.dataset.k].items.splice(+c.dataset.j,1);setPlan(u,p)}});
    const C=()=>JSON.parse(JSON.stringify(cfatsOf(u)));
    el.querySelectorAll('.cf').forEach(box=>{const ci=+box.dataset.ci;
      box.ondragover=e=>{e.preventDefault();box.classList.add('over')};box.ondragleave=()=>box.classList.remove('over');
      box.ondrop=e=>{e.preventDefault();e.stopPropagation();box.classList.remove('over');let d;try{d=JSON.parse(e.dataTransfer.getData('text/plain'))}catch(_){return}
        if(d.u!==+el.dataset.i)return;const id=d.id||d.cid||planOf(u)[+d.k].items[+d.j].id,c=C();c.forEach(g=>g.items=g.items.filter(x=>x.id!==id));
        if(ci<0)c.push({items:[{id}],note:''});else c[ci].items.push({id});setCfats(u,c.filter(g=>g.items.length||g===c[ci]))};
      if(ci<0)return;
      box.querySelector('.cdel').onclick=()=>{const c=C();c.splice(ci,1);setCfats(u,c)};
      box.querySelector('.cup').onclick=()=>{if(!ci)return;const c=C();[c[ci-1],c[ci]]=[c[ci],c[ci-1]];setCfats(u,c)};
      box.querySelectorAll('.cc').forEach(cc=>{cc.ondragstart=e=>{e.stopPropagation();e.dataTransfer.setData('text/plain',JSON.stringify({u:+el.dataset.i,cid:cc.dataset.id}))};
        cc.querySelector('.x').onclick=()=>{const c=C();c[ci].items=c[ci].items.filter(x=>x.id!==cc.dataset.id);setCfats(u,c)}})});
    el.querySelectorAll('.lrow').forEach(row=>{const k=+row.dataset.k;
      row.ondragover=e=>{e.preventDefault();row.classList.add('over')};row.ondragleave=()=>row.classList.remove('over');
      row.ondrop=e=>{e.preventDefault();row.classList.remove('over');let d;try{d=JSON.parse(e.dataTransfer.getData('text/plain'))}catch(_){return}
        if(d.u!==+el.dataset.i)return;const p=P();let it;
        if(d.cid)return;if(d.id)it={id:d.id};else{if(+d.k===k)return;it=p[+d.k].items.splice(+d.j,1)[0]}
        p[k].items.push(it);setPlan(u,p)};
      row.querySelector('.lnote').onchange=e=>{const p=P();p[k].note=e.target.value;setPlan(u,p)};
      row.querySelector('.up').onclick=()=>{if(!k)return;const p=P();[p[k-1],p[k]]=[p[k],p[k-1]];setPlan(u,p)};
      row.querySelector('.dn').onclick=()=>{const p=P();if(k>=p.length-1)return;[p[k+1],p[k]]=[p[k],p[k+1]];setPlan(u,p)};
      row.querySelector('.del').onclick=()=>{const p=P();if(p[k].items.length&&!confirm('Delete this lesson? Its subchapters go back to "Not in a lesson yet" unless they are in another lesson.'))return;p.splice(k,1);setPlan(u,p)}});
  });
}

/* ---------- Lesson planning: Course plan view (12MAG-style cards + nested lesson detail) ---------- */
function modeTog(){return `<span class="vtog"><button data-m="plan" class="${lmode==='plan'?'on':''}">Course plan</button><button data-m="edit" class="${lmode==='edit'?'on':''}">Edit lessons</button><button data-m="cfat" class="${lmode==='cfat'?'on':''}">CFAT planning</button></span>`}
function wireMode(box){box.querySelectorAll('.vtog button').forEach(b=>b.onclick=()=>{lmode=b.dataset.m;store.set('10ma-lmode',lmode);renderLessons()})}
const lnest=k=>store.get('10ma-nest:'+k)==='1';
function pnest(k,title,body,cnt,cls){return body?`<details class="nest ${cls||''}" data-nest="${k}" ${lnest(k)?'open':''}><summary>${title}${cnt!=null?`<span class="cnt">${cnt}</span>`:''}</summary><div class="nb">${body}</div></details>`:''}
function subRange(subs){if(!subs.length)return '';
  const ok=subs.every((s,i)=>i==0||(parseInt(s)==parseInt(subs[0])&&s.slice(-1).charCodeAt(0)==subs[i-1].slice(-1).charCodeAt(0)+1));
  return subs.length>2&&ok?`${subs[0]}–${subs[subs.length-1]}`:subs.join(subs.length==2&&ok?'–':', ')}
function lessonNests(L){const S=[...new Set(L.items.map(x=>x.id))].map(id=>IDX[id]).filter(Boolean),u=L.u;
  const pre=s=>(s.book==='G11'?'Y11 ':'')+s.sub;
  // grouped by subchapter, like 12MAG: one heading per subchapter, its items under it
  const grp=f=>{let n=0;const h=S.map(s=>{const a=f(s)||[];n+=a.length;return a.length?`<h4>${esc(pre(s))} ${esc(s.title)}</h4><ul>${a.join('')}</ul>`:''}).join('');return [h,n]};
  const li=t=>`<li>${t}</li>`;
  const [lo,nlo]=grp(s=>(s.learning_intentions||[]).map(t=>li(esc(t))));
  const [sc,nsc]=grp(s=>(s.success_criteria||[]).map(t=>li('☐ '+esc(t.text))));
  const [cur,ncur]=grp(s=>s.book==='G11'?(s.study_design||[]).map(c=>li(`<b>${esc(c.id.replace('GM-',''))}</b> ${esc(c.text)}`)):(s.vc2||[]).map(c=>li(`<b>${esc(c.code)}</b> ${c.tenA?'<span class="tag t10a">10A</span> ':''}${esc(c.text)}`)));
  const [voc,nvoc]=grp(s=>(s.key_definitions&&s.key_definitions.length?s.key_definitions.map(k=>li(`<b>${esc(k.term)}</b>: ${esc(k.definition)}`)):(s.key_vocab||[]).map(v=>li(esc(v)))));
  const [vid,nvid]=grp(s=>(s.videos||[]).map(v=>li(`<a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.title)}</a>`)));
  const [apk,napk]=grp(s=>(s.apk||[]).map(a=>li(`<b>${esc(a.book)}</b> ${esc(a.skill)}<div class="src">${esc(a.src)} #${a.n} (${esc(a.sub)}), PDF p. ${a.pdf_page}</div>`)));
  const [we,nwe]=grp(s=>(s.examples||[]).map(e=>li(`<b>Example ${e.n}</b> · ${esc(e.title)}<div class="src" style="color:var(--prac-i)">${e.now_you_try?'Now you try: same skill, new numbers':'No Now you try'}</div>`)));
  const [ex,nex]=grp(s=>(s.exit_tasks||[]).map(e=>li(`☐ ${esc(e.skill)}<div class="src">${esc(e.src)} #${e.n}, p. ${e.printed_page}</div>`)));
  const [cw,ncw]=grp(s=>s.coursework&&s.coursework.all?[li(`All students: whole of Exercise ${esc(s.sub)} (${esc(s.coursework.all.Exercise)})`)]:s.coursework?['good','better','best'].map(t=>li(`<b>${t[0].toUpperCase()+t.slice(1)}</b>: `+Object.entries(s.coursework[t]).filter(([k,v])=>v!=='–').map(([k,v])=>`${esc(k)} Q${esc(v)}`).join(' · '))):[]);
  const mats=S.flatMap(s=>(s.materials||[]).map(m=>li(`<b>${esc(m.title)}</b> ${m.html?`<a class="pill" href="../${encodeURI(m.html)}?v=${BUST}" target="_blank" rel="noopener">Open ↗</a>`:''} ${m.pdf?`<a class="pill" href="../${encodeURI(m.pdf)}?v=${BUST}" download>PDF ⬇</a>`:''}`)));
  if(L.kind==='teach')mats.push(li(`<b>Do Now sheet</b> <a class="pill" href="donow.html?s=${u.stream}&u=${numOf(u)}&l=${L.k+1}" target="_blank" rel="noopener">Open ↗</a>`));
  const dn=L.dn&&L.dn.items.length?L.dn.items.map(q=>li(`<b>${esc(q.sub)}</b> ${q.stem} ${q.tex}`)).join(''):'';
  return pnest('mat','Lesson materials',mats.length?`<ul>${mats.join('')}</ul>`:'',mats.length,'n-mat')
   +pnest('lo','Learning intentions',lo,nlo)+pnest('sc','Success criteria',sc,nsc)
   +pnest('cur',S.some(s=>s.book==='G11')?'Curriculum / Study Design':'Victorian Curriculum 2.0',cur,ncur)
   +pnest('voc','Key vocabulary',voc,nvoc)+pnest('vid','Self-study videos',vid,nvid)
   +pnest('dn','Do Now',dn?`<ul>${dn}</ul>`:'',dn?L.dn.items.length:null)
   +pnest('apk','APK (prior knowledge)',apk,napk)+pnest('we','Worked examples &amp; now you trys',we,nwe)
   +pnest('exit','Exit tasks',ex,nex)+pnest('cw','Coursework',cw,ncw)}
function planLessons(){ // every lesson in this stream, numbered through the course like 12MAG
  const us=UNITS.units.filter(u=>u.stream===lstream),DNS=DN.doNows(lstream,UNITS,LP,IDX);let n=0;
  return us.map(u=>{const p=planOf(u),cf=cfatsOf(u),at=cfatAfter(u,p),U=numOf(u);
    const cnt={},seen={};p.forEach(l=>l.kind==='teach'&&l.items.forEach(x=>cnt[x.id]=(cnt[x.id]||0)+1));
    const L=p.map((l,k)=>{n++;const subs=[...new Set(l.items.map(x=>{const s=IDX[x.id]?.sub||x.id;if(l.kind!=='teach'||cnt[x.id]<2)return s;seen[x.id]=(seen[x.id]||0)+1;return `${s} (part ${seen[x.id]})`}))],cfs=cf.map((c,ci)=>at[ci]===k?ci+1:0).filter(Boolean);
      const titles=[...new Set(l.items.map(x=>IDX[x.id]?.title).filter(Boolean))];
      return {...l,k,n,u,id:ukey(u)+'#'+k,cfs,section:subRange(subs),dn:DNS[(U-1)+'|'+k],
        title:l.kind==='assess'?(u.assessment||'Assessment'):l.kind==='review'?'Review':titles.join(' · ')||(l.kind==='practice'?'Practice':'Not planned yet')}});
    return {u,U,L,cf}})}
function pcard(l){return `<div class="card t-${l.kind} ${l.cfs.length?'has-cfat':''} ${lopenId===l.id?'open':''}" data-id="${esc(l.id)}">
  <div class="meta"><span>L${l.n}${l.section?' · '+esc(l.section):''}</span><span class="tags">${l.cfs.length?`<span class="tag cfat">CFAT ${l.cfs.join(', ')}</span>`:''}<span class="tag">${l.kind==='assess'?'Assessment':KIND[l.kind]}</span></span></div>
  <div class="ttl">${esc(l.title)}${l.note?`<div class="src">${esc(l.note)}</div>`:''}</div></div>`}
function pdetail(l){return `<div class="pdetail" data-for="${esc(l.id)}"><div class="meta">${SH[l.u.stream]}${numOf(l.u)} ${esc(l.u.name)} · Lesson ${l.n}</div>
  <h2>${l.section?esc(l.section)+' · ':''}${esc(l.title)}</h2>
  ${l.items.length?lessonNests(l):'<div class="empty">No subchapters in this lesson.</div>'}
  <h3 style="font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:6px 0 0">Lesson note</h3>
  <textarea class="pnote" data-k="${l.k}" placeholder="Notes for this lesson…">${esc(l.note||'')}</textarea></div>`}
function cfatCards(g){const M=(LP.materials||{})[ukey(g.u)]||[];
  const cf=g.cf.map((c,ci)=>{const m=M.find(m=>m.kind==='cfat'&&m.n===ci+1);
    return `<div class="card fa t-cfat"><div class="meta"><span>After L${(g.L.find(l=>l.cfs.includes(ci+1))||{}).n||'?'}</span><span class="tags"><span class="tag">${m?'Ready':'To build'}</span></span></div>
     <div class="ttl">CFAT ${ci+1} · ${esc(subRange(c.items.map(x=>IDX[x.id]?.sub||x.id)))}</div>
     ${m?`<div><a href="../${encodeURI(m.html)}?v=${BUST}" target="_blank" rel="noopener">Open ↗</a><a href="../${encodeURI(m.solutions)}?v=${BUST}" target="_blank" rel="noopener">Solutions ↗</a></div>`:''}</div>`}).join('');
  const sl=M.find(m=>m.kind==='slides'),wb=M.filter(m=>m.kind!=='slides'&&m.kind!=='cfat'&&m.kind!=='cat');
  const um=`<div class="card fa t-teach"><div class="ttl">Unit materials</div><div>
    ${sl?`<a href="../${encodeURI(sl.html)}?v=${BUST}" target="_blank" rel="noopener">Slides ↗</a>`:''}
    ${wb.map(m=>m.pdf?`<a href="../${encodeURI(m.pdf)}?v=${BUST}" target="_blank" rel="noopener">${esc(m.title)} ↗</a>`:'').join('')}
    <a href="donow.html?s=${g.u.stream}&u=${g.U}" target="_blank" rel="noopener">Do Now sheets ↗</a></div></div>`;
  return (cf||'<div class="empty">No CFATs yet: set them in Edit lessons</div>')+um}
function renderPlanView(){
  const box=document.getElementById('lessons'),top=box.scrollTop,G=planLessons(),tot=G.reduce((a,g)=>a+g.L.length,0);
  let h=`<div class="ybar">${STREAMS.map(s=>`<button class="cls ${s===lstream?'on':''}" data-s="${s}">${s}</button>`).join('')}${modeTog()}
    <button class="btn" id="lexp">${lexpand?'Collapse all':'Expand all'}</button>
    <span class="src">${tot} lessons · ${G.length} units · 3 lessons per week · no dates (the 2027 tab adds them). Click a lesson for its plan.</span></div><div class="cp">
    <div class="legend"><span class="t-teach"><i></i>Lesson</span><span class="t-practice"><i></i>Practice</span><span class="t-review"><i></i>Review</span><span class="t-assess"><i></i>Assessment</span><span><i style="background:#8a6ad8"></i>CFAT</span></div>`;
  const SPL=lstream==='10MAG';
  h+=G.map(g=>`<div class="aos"><b>${SH[g.u.stream]}${g.U} · ${esc(g.u.name)}</b><span>${g.L.length} lessons · ${esc(g.u.assessment||'')}${g.u.note?' · '+esc(g.u.note):''}</span></div>
    ${SPL?splitUnit(g):`<div class="chgrid"><div class="wl"><span class="cn">Unit ${SH[g.u.stream]}${g.U}</span><b>${esc(g.u.name)}</b>${g.L.length} lessons</div>
    <div class="pcol"><div class="pcolh">Lessons</div>${g.L.map(l=>pcard(l)+(lexpand||l.id===lopenId?pdetail(l):'')).join('')||'<div class="empty">No subchapters in this unit yet</div>'}</div>
    <div class="pcol"><div class="pcolh">Formative assessments</div>${cfatCards(g)}</div></div>`}`).join('')||'<p class="empty">No units for this stream yet</p>';
  box.innerHTML=h+'</div>';box.classList.toggle('wide',SPL);box.scrollTop=top;wireMode(box);
  box.querySelectorAll('.mrm').forEach(b=>b.onclick=e=>{e.stopPropagation();MOD.sheets[b.dataset.sub].splice(+b.dataset.i,1);saveMod()});
  box.querySelectorAll('.madd').forEach(sl=>sl.onchange=()=>{if(!sl.value)return;const a=MOD.sheets[sl.dataset.sub]=MOD.sheets[sl.dataset.sub]||[];if(!a.includes(sl.value))a.push(sl.value);saveMod()});
  box.querySelectorAll('.mapp').forEach(c=>c.onchange=()=>{MOD.approved[c.dataset.k]=c.checked?new Date().toLocaleDateString('en-CA'):undefined;if(!c.checked)delete MOD.approved[c.dataset.k];saveMod()});
  box.querySelectorAll('.cls').forEach(b=>b.onclick=()=>{lstream=b.dataset.s;store.set('10ma-lstream',lstream);lopenId=null;renderLessons()});
  box.querySelector('#lexp').onclick=()=>{lexpand=!lexpand;renderLessons()};
  box.querySelectorAll('.card[data-id]').forEach(el=>el.onclick=()=>{lopenId=lopenId===el.dataset.id?null:el.dataset.id;renderLessons()});
  box.querySelectorAll('[data-nest]').forEach(n=>n.ontoggle=()=>store.set('10ma-nest:'+n.dataset.nest,n.open?'1':'0'));
  box.querySelectorAll('.pdetail[data-for]').forEach(dv=>{const id=dv.dataset.for,g=G.find(g=>id.startsWith(ukey(g.u)+'#'));
    dv.querySelector('.pnote').onchange=e=>{const p=JSON.parse(JSON.stringify(planOf(g.u)));p[+e.target.dataset.k].note=e.target.value;setPlan(g.u,p)}});
  if(window.renderMathInElement)renderMathInElement(box,{delimiters:[{left:'$',right:'$',display:false}],throwOnError:false});
}

/* ---------- Lesson planning: CFAT planning (both streams side by side + decisions log) ---------- */
function cfatCode(u,ci,c){const s=IDX[c.items[0]?.id];return `${numOf(u)}.${s?s.chapter:'?'}.${ci+1}`}
function allCfats(stream){const out=[];UNITS.units.filter(u=>u.stream===stream).forEach(u=>{const M=(LP.materials||{})[ukey(u)]||[];
  cfatsOf(u).forEach((c,ci)=>{if(!c.items.length)return;out.push({u,ci,c,code:cfatCode(u,ci,c),subs:c.items.map(x=>x.id),m:M.find(m=>m.kind==='cfat'&&m.n===ci+1)})})});return out}
function cfChip(x){if(!x)return '<span class="empty">–</span>';
  return `<b>CFAT ${x.code}</b> <span class="src">${esc(subRange(x.subs.map(i=>IDX[i]?.sub||i)))}</span> ${x.m?`<a class="pill" href="../${encodeURI(x.m.html)}?v=${BUST}" target="_blank" rel="noopener">Open ↗</a>`:'<span class="tag">to build</span>'}`}
function renderCfatView(){
  const box=document.getElementById('lessons'),top=box.scrollTop,G=allCfats('10MAG'),A=allCfats('10MAA');
  const byId=(arr,id)=>arr.find(x=>x.subs.includes(id));
  // every subchapter on any CFAT, in textbook order
  const ids=[...new Set([...G,...A].flatMap(x=>x.subs))].sort((a,b)=>{const x=IDX[a],y=IDX[b];return (x?.book||'').localeCompare(y?.book||'')||(x?.chapter||0)-(y?.chapter||0)||(x?.sub||a).localeCompare(y?.sub||b,undefined,{numeric:true})});
  let rows='',last='';
  ids.forEach(id=>{const s=IDX[id],ch=s?`${s.book==='G11'?'Year 11 · ':''}Chapter ${s.chapter}`:'';if(ch!==last){last=ch;rows+=`<tr class="chr"><td colspan="4">${esc(ch)}</td></tr>`}
    const g=byId(G,id),a=byId(A,id);
    rows+=`<tr><td><b>${s?(s.book==='G11'?'Y11 ':'')+s.sub:id}</b> ${esc(s?.title||'')}</td><td>${cfChip(g)}</td><td>${cfChip(a)}</td><td>${g&&a?'<span class="tag" style="--b:var(--prac);--tc:var(--prac-i)">both</span>':g?'10MAG only':'10MAA only'}</td></tr>`});
  const CL=CLOG,rl=(CL.rules||[]).map(r=>`<li>${esc(r)}</li>`).join(''),op=(CL.open||[]).map((r,i)=>`<li>${esc(r)} <button class="x odel" data-i="${i}" title="Remove (settled)">✕</button></li>`).join('');
  const dec=(CL.decisions||[]).map((d,i)=>`<tr><td>${esc(d.date)}</td><td>${esc(d.stream)}</td><td>${esc(d.unit||'')}</td><td>${esc(d.decision)}</td><td>${esc(d.by||'')}</td><td><button class="x ddel" data-i="${i}" title="Delete">✕</button></td></tr>`).join('');
  const uopts=[...new Set(UNITS.units.map(u=>u.name))].map(n=>`<option>${esc(n)}</option>`).join('');
  box.innerHTML=`<div class="ybar">${modeTog()}<span class="src">${G.length} 10MAG CFATs · ${A.length} 10MAA CFATs · ${G.filter(x=>x.m).length+A.filter(x=>x.m).length} built. Decisions save with <b>Save to GitHub</b> (courses/cfat-log.json).</span></div>
  <div class="cp cfp">
   <div class="aos"><b>Decisions log</b><span>${(CL.decisions||[]).length} decisions</span></div>
   <div class="dadd"><input type="date" id="dd" value="${new Date().toLocaleDateString('en-CA')}"><select id="ds"><option>Both</option><option>10MAG</option><option>10MAA</option></select>
    <select id="du"><option value="">All units</option>${uopts}</select><input id="dt" placeholder="Decision…" style="flex:1"><select id="db"><option>Rocco</option><option>Claude</option></select><button class="btn dark" id="dadd">Add</button></div>
   <table class="ctab"><tr><th>Date</th><th>Stream</th><th>Unit</th><th>Decision</th><th>By</th><th></th></tr>${dec}</table>
   <div class="aos"><b>CFATs across streams</b><span>Each subchapter and the CFAT that assesses it in each stream</span></div>
   <table class="ctab"><tr><th>Subchapter</th><th>10MAG</th><th>10MAA</th><th></th></tr>${rows}</table>
   <div class="chgrid" style="grid-template-columns:1fr 1fr;margin-top:18px"><div><div class="aos"><b>Standing rules</b></div><ul class="crl">${rl}</ul></div>
    <div><div class="aos"><b>Open questions</b></div><ul class="crl">${op||'<li class="empty">None</li>'}</ul><div class="dadd"><input id="oq" placeholder="New open question…" style="flex:1"><button class="btn" id="oadd">Add</button></div></div></div></div>`;
  box.scrollTop=top;wireMode(box);
  const sv=()=>{store.set(CKEY,JSON.stringify(CLOG));clDirty=true;status();renderLessons()};
  box.querySelector('#dadd').onclick=()=>{const t=box.querySelector('#dt').value.trim();if(!t)return;
    CLOG.decisions=CLOG.decisions||[];CLOG.decisions.unshift({date:box.querySelector('#dd').value,stream:box.querySelector('#ds').value,unit:box.querySelector('#du').value,decision:t,by:box.querySelector('#db').value});sv()};
  box.querySelector('#oadd').onclick=()=>{const t=box.querySelector('#oq').value.trim();if(!t)return;CLOG.open=CLOG.open||[];CLOG.open.push(t);sv()};
  box.querySelectorAll('.ddel').forEach(b=>b.onclick=()=>{if(confirm('Delete this decision?')){CLOG.decisions.splice(+b.dataset.i,1);sv()}});
  box.querySelectorAll('.odel').forEach(b=>b.onclick=()=>{CLOG.open.splice(+b.dataset.i,1);sv()});
}

/* ---------- 10MAG Modified (Freefall) column ---------- */
function saveMod(){store.set(MKEY,JSON.stringify(MOD));modDirty=true;status();renderLessons()}
const ffLabel=s=>`${esc(s.id)} ${esc(s.title)} <span class="src">${esc(FFB[s.book]?.name||s.book)}, PDF pp. ${s.start}–${s.end}</span>`;
function modSheets(l){return [...new Set(l.items.map(x=>x.id))].flatMap(id=>(MOD.sheets[id]||[]).map(k=>FF[k]).filter(Boolean))}
function mcard(l){if(l.kind!=='teach'&&l.kind!=='practice')return pcard({...l,id:'M:'+l.id}).replace('class="card','class="card mod');
  const S=modSheets(l),gap=l.items.length&&!S.length;
  return `<div class="card mod t-mod ${gap?'gap':''} ${lopenId==='M:'+l.id?'open':''}" data-id="M:${esc(l.id)}">
   <div class="meta"><span>L${l.n}${l.section?' · '+esc(l.section):''}</span><span class="tags">${l.cfs.length?`<span class="tag cfat">CFAT ${l.cfs.map(c=>c+'M').join(', ')}</span>`:''}${(((MOD.materials||{})[ukey(l.u)]||{}).worksheets||{})[String(l.k)]?'<span class="tag" style="--b:#e0f4f0;--c:#1d7266">Worksheet</span>':''}<span class="tag">${gap?'No match yet':S.length+' Freefall sheet'+(S.length===1?'':'s')}</span></span></div>
   <div class="ttl">${S.length?esc([...new Set(S.map(s=>s.title))].join(' · ')):gap?'Decide: closest sheets, Cambridge 7–8, or unmodified':esc(l.title)}</div></div>`}
function mdetail(l){const subs=[...new Set(l.items.map(x=>x.id))];
  const opts=Object.values(FFB).length?Object.keys(FFB).map(b=>`<optgroup label="${esc(FFB[b].name)}">${Object.values(FF).filter(s=>s.book===b).map(s=>`<option value="${esc(s.id)}">${esc(s.id)} ${esc(s.chapter_title)}: ${esc(s.title)}</option>`).join('')}</optgroup>`).join(''):'';
  const mw=((MOD.materials||{})[ukey(l.u)]||{}).worksheets||{},wf=mw[String(l.k)];
  return `<div class="pdetail" data-mfor="${esc(l.id)}"><div class="meta">10MAG Modified · Lesson ${l.n}</div><h2>${l.section?esc(l.section)+' · ':''}Modified lesson</h2>
  ${wf?`<div class="nest n-mat" style="padding:8px 12px"><b>Modified worksheet</b> <a class="pill" href="../${encodeURI(wf)}?v=${BUST}" target="_blank" rel="noopener">Open ↗</a> <a class="pill" href="../${encodeURI(wf.replace(/\.html$/,'.pdf'))}?v=${BUST}" download>PDF ⬇</a><div class="src">Year 7–9 Cambridge Example → You try pairs. Practice = the Freefall sheets below (in the modified workbook).</div></div>`:''}<h4 style="margin:8px 0 2px">Freefall sheets</h4>
  ${subs.map(id=>{const s=IDX[id],L=(MOD.sheets[id]||[]);return `<h4 style="margin:6px 0 2px">${esc(s?.sub||id)} ${esc(s?.title||'')}</h4>
    <ul class="crl">${L.map((k,i)=>`<li>${FF[k]?ffLabel(FF[k]):esc(k)} <button class="x mrm" data-sub="${id}" data-i="${i}" title="Remove">✕</button></li>`).join('')||'<li class="empty">No Freefall match yet</li>'}</ul>
    <div class="dadd"><select class="madd" data-sub="${id}" style="flex:1;max-width:100%"><option value="">+ add a Freefall sheet…</option>${opts}</select></div>`}).join('')}
  <p class="src">Freefall PDFs are licensed to the school: the modified workbook lives on G: (the link opens it in Google Drive for staff with access).</p></div>`}
function splitLessons(g){const out=[[],[],[],[]];
  g.L.forEach(l=>{
    if(l.kind==='assess'){out[1].push(pcard(l));((LP.materials||{})[ukey(g.u)]||[]).filter(m=>m.kind==='cat').forEach(m=>out[1].push(`<div class="card fa t-assess"><div class="meta"><span>CAT</span><span class="tags"><span class="tag">${esc(m.status||'Draft')}</span></span></div><div class="ttl">${esc(m.title)}</div>${m.html||m.pdf?`<div><a href="../${encodeURI(m.html||m.pdf)}?v=${BUST}" target="_blank" rel="noopener">Open ↗</a>${m.solutions?`<a href="../${encodeURI(m.solutions)}?v=${BUST}" target="_blank" rel="noopener">Solutions ↗</a>`:''}</div>`:'<div class="src">Made by hand</div>'}</div>`));out[3].push(pcard({...l,id:'M:'+l.id,title:'Modified '+l.title}));return}
    out[0].push(pcard(l)+(lexpand||l.id===lopenId?pdetail(l):''));out[2].push(mcard(l)+((lexpand||'M:'+l.id===lopenId)&&(l.kind==='teach'||l.kind==='practice')?mdetail(l):''));
    l.cfs.forEach(ci=>{const c=g.cf[ci-1],M=((LP.materials||{})[ukey(g.u)]||[]).find(m=>m.kind==='cfat'&&m.n===ci),code=cfatCode(g.u,ci-1,c),rng=esc(subRange(c.items.map(x=>IDX[x.id]?.sub||x.id)));
      out[1].push(`<div class="card fa t-cfat"><div class="meta"><span>After L${l.n}</span><span class="tags"><span class="tag">${M?'Ready':'To build'}</span></span></div><div class="ttl">CFAT ${code} · ${rng}</div>${M?`<div><a href="../${encodeURI(M.html)}?v=${BUST}" target="_blank" rel="noopener">Open ↗</a><a href="../${encodeURI(M.solutions)}?v=${BUST}" target="_blank" rel="noopener">Solutions ↗</a></div>`:''}</div>`);
      const MM=(((MOD.materials||{})[ukey(g.u)]||{}).cfats||[]).find(m=>m.n===ci);
      out[3].push(`<div class="card fa t-cfat mod"><div class="meta"><span>After L${l.n}</span><span class="tags"><span class="tag">${MM?'Ready':'To plan'}</span></span></div><div class="ttl">CFAT ${code}M · ${rng}</div>${MM?`<div><a href="../${encodeURI(MM.html)}?v=${BUST}" target="_blank" rel="noopener">Open ↗</a><a href="../${encodeURI(MM.solutions)}?v=${BUST}" target="_blank" rel="noopener">Solutions ↗</a></div>`:'<div class="src">Same week and skills, Year 7–8 level</div>'}</div>`)})});
  return out}
function umatSolid(g){const M=(LP.materials||{})[ukey(g.u)]||[],sl=M.find(m=>m.kind==='slides'),wb=M.filter(m=>m.kind!=='slides'&&m.kind!=='cfat'&&m.kind!=='cat');
  return `<div class="umsolid"><div class="ttl">Unit materials</div><div>${sl?`<a href="../${encodeURI(sl.html)}?v=${BUST}" target="_blank" rel="noopener">Slides ↗</a>`:''}${wb.map(m=>m.pdf?`<a href="../${encodeURI(m.pdf)}?v=${BUST}" target="_blank" rel="noopener">${esc(m.title)} ↗</a>`:'').join('')}<a href="donow.html?s=${g.u.stream}&u=${g.U}" target="_blank" rel="noopener">Do Now sheets ↗</a></div></div>`}
function splitUnit(g){const [a,c,b,d]=splitLessons(g),k=ukey(g.u),ap=MOD.approved[k];
  return `<div class="split"><div class="pcol"><div class="pcolh">10MAG lessons</div>${umatSolid(g)}${a.join('')||'<div class="empty">No subchapters in this unit yet</div>'}</div>
   <div class="pcol"><div class="pcolh">10MAG assessments</div>${c.join('')||'<div class="empty">No assessments yet</div>'}</div>
   <div class="pcol modcol"><div class="pcolh">Modified lessons</div>
   <div class="umsolid mod"><div class="ttl">Modified unit materials</div><div>${((MOD.materials||{})[k]||{}).workbook_url?`<a href="${esc(MOD.materials[k].workbook_url)}" target="_blank" rel="noopener">Modified workbook ↗</a>`:`<span class="nolink">Modified workbook: ${ap?'approved, ready to build':'built once the mapping is approved'}</span>`}${(MOD.g_folders||{}).lesson_materials?`<a href="${esc(MOD.g_folders.lesson_materials)}" target="_blank" rel="noopener">G: Lesson materials ↗</a><a href="${esc(MOD.g_folders.assessments)}" target="_blank" rel="noopener">G: Assessments ↗</a>`:''}</div>
   <label><input type="checkbox" class="mapp" data-k="${esc(k)}" ${ap?'checked':''}> Freefall mapping approved</label></div>${b.join('')}</div>
   <div class="pcol modcol"><div class="pcolh">Modified assessments</div>${d.join('')||'<div class="empty">No assessments yet</div>'}</div></div>`}

const modal=document.getElementById('modal');
modal.onclick=e=>{if(e.target===modal)modal.classList.remove('on')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('on')});
function showDetail(id){
  const x=IDX[id];if(!x)return;
  const li=a=>a&&a.length?'<ul>'+a.join('')+'</ul>':'<p class="empty">Not filled yet</p>';
  const S=(n,t,body,wide)=>`<div class="sec ${wide?'wide':''}"><h3><span class="step">${n}</span>${t}</h3>${body}</div>`;
  const full=x.status==='indexed'||x.status==='full', u=usedIn(id);
  let h=`<button class="btn close" onclick="modal.classList.remove('on')">Close</button>
   <h2>${x.sub} ${esc(x.title)} ${x.tenA?'<span class="tag t10a">10A</span>':''}${x.extension?'<span class="tag text">Extension</span>':''}</h2>
   <div class="sub">${x.id} · ${x.book==='C10'?'Cambridge 10 &amp; 10A':'Cambridge General U1&amp;2'} pp. ${x.printed_page}–${x.printed_end} (PDF ${x.pdf_page}–${x.pdf_end})${u.length?` · in ${u.join(', ')}`:''}${full?'':' · <b>basic index only</b>: the lesson-plan fields get filled when this chapter is done'}</div><div class="flow">`;
  if((x.materials||[]).length)h+=`<div class="sec wide mats"><h3>Lesson materials</h3>${x.materials.map(m=>`<b>${esc(m.title)}</b> ${m.html?`<a class="btn" href="../${encodeURI(m.html)}?v=${BUST}" target="_blank" rel="noopener">Open ↗</a> `:''}${m.pdf?`<a class="btn" href="../${encodeURI(m.pdf)}?v=${BUST}" download>PDF ⬇</a>`:''}`).join(' &nbsp; ')}</div>`;
  h+=S(1,'Learning intentions',li((x.learning_intentions||[]).map(t=>`<li>${esc(t)}</li>`)));
  if(x.book==='G11')h+=S(2,'VCE Study Design (General Maths U1&amp;2)',li((x.study_design||[]).map(c=>`<li><span class="code">${c.id.replace('GM-','')}</span> <span class="tag">${c.kind==='content'?'content':'key knowledge'}</span> ${esc(c.text)}<br><span class="src">Unit ${c.unit} · ${esc(c.topic)}</span></li>`)));else
  h+=S(2,'Victorian Curriculum 2.0',li((x.vc2||[]).map(c=>`<li><span class="code">${c.code}</span> ${c.tenA?'<span class="tag t10a">10A</span> ':''}${c.level==='9'?'<span class="tag">L9 review</span> ':''}${esc(c.text)}</li>`)));
  if(x.retrieval)h+=S(3,`Retrieval pool (${x.retrieval.length}): used in the Do Now of lessons after this one`,'<ul class="rp">'+x.retrieval.map(q=>`<li>${q.stem} ${q.tex} <span class="src">${esc(q.src)}, p. ${q.page}${q.tenA?' · 10A':''}</span></li>`).join('')+'</ul>',true);else
  h+=S(3,'Do Now (retrieval)',li((x.do_now||[]).map(d=>`<li><span class="slot">${esc(d.slot)}</span> · ${esc(d.sub)}: ${esc(d.src)} Q${d.q} <span class="src">(${d.printed_page?'p. '+d.printed_page:'PDF p. '+d.pdf_page})${d.note?' · '+esc(d.note):''}</span></li>`)));
  if(x.do_now_pool&&x.do_now_pool.length||x.edrolo_lessons)h+=S('3b','Do Now pool (Edrolo VCAA questions on this subchapter: use in the lesson after it)',(x.edrolo_lessons&&x.edrolo_lessons.length?'<p class="src">Edrolo lessons: '+x.edrolo_lessons.map(esc).join(', ')+'</p>':'<p class="src">No matching Edrolo lesson (old study design)</p>')+li((x.do_now_pool||[]).map(q=>`<li>${esc(q.src)} <span class="src">(${esc(q.section)}, PDF p. ${q.pdf_page}${q.mapped_by==='keyword'?'':' · '+esc(q.mapped_by)})</span><br>${esc(q.vcaa)}<br><span class="src">e.g. <span class="loc">${esc(q.question_locator)}</span></span></li>`)),true);
  h+=S(4,x.book==='G11'?'APK (priming: Year 9 → 10)':'APK (priming: Year 7 → 8 → 9)',li((x.apk||[]).map(a=>`<li><b>${esc(a.book)}</b> ${esc(a.skill)}<br><span class="src">e.g. <span class="loc">${esc(a.question_locator)}</span> · ${esc(a.src)} #${a.n} (${a.sub}), PDF p. ${a.pdf_page}</span></li>`)));
  h+=S(5,'Key vocabulary',(x.key_vocab||[]).length?`<div class="vocab">${x.key_vocab.map(v=>`<span>${esc(v)}</span>`).join('')}</div><p class="src">${esc(x.key_vocab_note)}</p>`:'<p class="empty">Not filled yet</p>');
  if(x.key_definitions&&x.key_definitions.length)h+=S('5b','Key definitions (glossary)','<ul>'+x.key_definitions.map(k=>`<li><b>${esc(k.term)}</b>: ${esc(k.definition)} <span class="src">(p. ${k.printed_page})</span></li>`).join('')+'</ul>',true);
  h+=S(6,'Self-study videos',li((x.videos||[]).map(v=>`<li><a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.title)}</a></li>`)));
  h+=S(7,'Worked examples → Now you try',li((x.examples||[]).map(e=>`<li><b>Example ${e.n}</b> ${esc(e.title)}${e.now_you_try?' <span class="tag tfull">+ Now you try</span>':''}</li>`)));
  h+=S(8,'Exercise '+x.sub,li((x.exercise||[]).map(e=>`<li><b>${SECN[e.section]||e.section}</b>${e.title?' · '+esc(e.title):''} Q${esc(e.q)}${e.pathways?` <span class="src">(pathways: ${e.pathways.map(esc).join(' | ')})</span>`:''}</li>`)));
  if(x.coursework&&x.coursework.all)h+=S('8b','Coursework',`<p><b>All students: complete the whole of Exercise ${esc(x.sub)}</b> (${esc(x.coursework.all.Exercise)})</p><p class="src">${esc(x.coursework_note||'')}</p>`,true);else if(x.coursework)h+=S('8b','Coursework options (Good / Better / Best)','<table class="hwo"><tr><th></th>'+Object.keys(x.coursework.good).map(k=>`<th>${k}</th>`).join('')+'</tr>'+['good','better','best'].map(t=>`<tr><th>${t[0].toUpperCase()+t.slice(1)}</th>`+Object.values(x.coursework[t]).map(v=>`<td>${v==='–'?'–':'Q'+esc(v)}</td>`).join('')+'</tr>').join('')+`</table><p class="src">${esc(x.coursework_note||'')}</p>`,true);
  h+=S(9,'Exit tasks (skills checklist questions)',li((x.exit_tasks||[]).map(e=>`<li>☐ ${esc(e.skill)}<br><span class="src">e.g. <span class="loc">${esc(e.question_locator)}</span> · checklist #${e.n}, p. ${e.printed_page}</span></li>`)),true);
  h+=S(10,'Success criteria (end-of-lesson skills checklist)',li((x.success_criteria||[]).map(s=>`<li>☐ ${esc(s.text)}</li>`)),true);
  document.getElementById('detail').innerHTML=h+'</div>';
  if(window.renderMathInElement)renderMathInElement(document.getElementById('detail'),{delimiters:[{left:'$',right:'$',display:false}],throwOnError:false});
  modal.classList.add('on');
}
</script>
