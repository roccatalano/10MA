<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10MA Course Planner</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1f1e1c;--muted:#6b6a65;--line:#e2e0d8;--accent:#2f5fd0;
--lesson:#eef3fd;--lesson-i:#1d4596;--prac:#e6f5ee;--prac-i:#0f6e56;--sac:#fcebeb;--sac-i:#a32d2d;
--review:#faeeda;--review-i:#854f0b;--other:#f1efe8;--other-i:#5f5e5a;--g11:#6b3fa0;--g11b:#f2ecfa}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;height:100vh;display:flex;flex-direction:column}
header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;font-weight:600;margin:0 8px 0 0}
header .save{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}
button,select,input{font:inherit}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.cols{flex:1;display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:14px;padding:14px 16px;min-height:0}
.col{display:flex;flex-direction:column;min-height:0;background:#efede6;border-radius:14px;border:1px solid var(--line)}
.colh{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.colh h2{margin:0;font-size:15px}.colh span{color:var(--muted);font-size:12px}
.colb{overflow:auto;padding:10px;flex:1}
.chap{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--bk);border-radius:12px;margin-bottom:9px}
.chap.C10{--bk:var(--lesson-i)}.chap.G11{--bk:var(--g11)}
.chap-h{padding:9px 11px;display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.chap-h .caret{color:var(--muted);width:12px;transition:transform .15s}
.chap.open .caret{transform:rotate(90deg)}
.chap-h .t{flex:1}.chap-h b{font-size:14px}
.chap-h .m{color:var(--muted);font-size:11px;margin-top:2px}
.chap-b{padding:0 11px 11px;display:none}.chap.open .chap-b{display:block}
.mini{border:1px solid var(--line);border-radius:9px;margin-bottom:7px;background:#fbfaf6}
.mini>summary{cursor:pointer;padding:6px 10px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;list-style:none}
.mini>summary::-webkit-details-marker{display:none}
.mini>summary::before{content:'▸ '}.mini[open]>summary::before{content:'▾ '}
.mini ul{margin:0;padding:0 10px 8px 10px;list-style:none;font-size:12.5px;line-height:1.45}
.mini li{margin-bottom:3px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;font-weight:600}
.sc{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--bk);border-radius:8px;padding:6px 9px;margin-bottom:5px;cursor:grab;display:flex;gap:8px;align-items:center}
.sc:hover{border-color:var(--muted);border-left-color:var(--bk)}
.sc.is10a{border-left-color:var(--sac-i)}
.sc .id{font-weight:700;font-size:12px;min-width:30px}
.sc .tt{flex:1;line-height:1.25;font-size:13px}
.sc .used{font-size:10.5px;color:var(--prac-i);font-weight:600}
.tag{font-size:10.5px;padding:1px 6px;border-radius:6px;background:var(--b,var(--other));color:var(--tc,var(--other-i));white-space:nowrap}
.t10a{--b:var(--sac);--tc:var(--sac-i);font-weight:600}.tcons{--b:var(--review);--tc:var(--review-i)}.tfull{--b:var(--prac);--tc:var(--prac-i)}.text{--b:var(--g11b);--tc:var(--g11)}
.dragall{font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:2px 7px;cursor:grab;white-space:nowrap}
.unit{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;border-top:4px solid var(--ink)}
.unit.over{outline:2px dashed var(--accent);background:#f4f7ff}
.uh{padding:9px 11px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.uh .num{font-weight:700;color:var(--muted)}
.uh input.name{flex:1;min-width:150px;border:1px solid transparent;border-radius:6px;padding:3px 6px;font-weight:600;font-size:14px}
.uh input.name:hover,.uh input.name:focus{border-color:var(--line)}
.uh select{border:1px solid var(--line);border-radius:6px;padding:2px 4px;font-size:12px}
.stream{font-size:11px;border:1px solid var(--line);border-radius:12px;padding:2px 8px;cursor:pointer;background:#fff;color:var(--muted)}
.stream.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ub{padding:0 11px 10px}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:8px;text-align:center;color:var(--muted);font-size:12px;margin-top:4px}
.ui{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:6px;border-left:4px solid var(--bk);background:#fbfaf6;margin-bottom:3px;font-size:13px;cursor:grab}
.ui.C10{--bk:var(--lesson-i)}.ui.G11{--bk:var(--g11)}
.ui .id{font-weight:700;font-size:12px;min-width:56px}.ui .tt{flex:1;line-height:1.2;cursor:pointer}
.ui input{width:44px;border:1px solid var(--line);border-radius:5px;padding:1px 4px;text-align:center}
.x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:15px;padding:0 3px}
.x:hover{color:var(--sac-i)}
.utot{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:6px 2px 2px}
.utot b{color:var(--ink)}
.uinfo{margin-top:6px}
.vers{display:grid;grid-template-columns:1fr 1fr;gap:8px}.vers.one{grid-template-columns:1fr}
.ver{border:1px solid var(--line);border-radius:9px;padding:6px;background:#fdfcf9;min-width:0}
.ver.over{outline:2px dashed var(--accent);background:#f4f7ff}
.ver.off{display:flex;align-items:center;justify-content:center;border-style:dashed;background:none;min-height:60px}
.vh{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}.vh select{border:1px solid var(--line);border-radius:6px;padding:1px 3px;font-size:11.5px}.vh b{font-size:12px;flex:1}
.vfoot{font-size:11px;color:var(--muted);padding:4px 2px 0}
.ui.only{background:#fff7e0}
.ver .ui{font-size:12px;gap:5px;padding:3px 5px}.ver .ui .id{min-width:auto;font-size:11px}
.lesbox{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap}.lesbox input{width:52px;border:1px solid var(--line);border-radius:6px;padding:2px 4px;text-align:center;font-weight:600;color:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(30,30,28,.35);display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow:auto;z-index:20}
.modal.on{display:flex}
.detail{background:var(--card);border-radius:14px;max-width:1000px;width:100%;padding:18px 20px;position:relative}
.detail h2{font-size:18px;margin:0 70px 0 0}.detail .sub{color:var(--muted);font-size:12px;margin:3px 0 12px}
.detail .close{position:absolute;top:12px;right:14px}
.flow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.sec{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fdfcf9}.sec.wide{grid-column:1/-1}
.sec h3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px;display:flex;align-items:center}
.sec .step{display:inline-block;font-size:11px;font-weight:600;color:#fff;background:var(--ink);border-radius:5px;padding:1px 6px;margin-right:6px}
.sec ul{margin:0;padding-left:18px;line-height:1.5}.sec li{margin-bottom:3px}
.src{color:var(--muted);font-size:12px}.loc{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--other);border-radius:4px;padding:0 4px}
.slot{font-size:11px;font-weight:600;color:var(--lesson-i)}
.vocab{display:flex;flex-wrap:wrap;gap:6px}.vocab span{border:1px solid var(--line);border-radius:14px;padding:2px 10px;background:#fff}
.empty{color:var(--muted);font-style:italic}
a{color:var(--accent)}
@media(max-width:1000px){body{height:auto}.cols{grid-template-columns:1fr}.colb{max-height:70vh}.flow{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>10MA Course Planner</h1>
  <span class="src">Drag a subchapter (or a whole chapter with ⠿ all) into a unit. Click a subchapter for its lesson plan.</span>
  <div class="save"><span id="saved"></span>
    <button class="btn dark" id="gh" title="Commit the unit plan to github.com/roccatalano/10MA">Save to GitHub</button>
    <button class="btn" id="ghkey" title="Set the GitHub access key this browser uses to save">🔑</button>
    <button class="btn" id="exp" title="Download units.json">Export</button>
    <button class="btn" id="imp">Import</button><input type="file" id="impf" accept=".json" hidden>
    <button class="btn" id="reset" title="Throw away unsaved changes and reload what is on GitHub">Discard changes</button></div>
</header>
<div class="cols">
  <section class="col"><div class="colh"><h2>Year 10 textbook</h2><span>Cambridge 10 &amp; 10A</span></div><div class="colb" id="c10"></div></section>
  <section class="col"><div class="colh"><h2>Year 11 textbook</h2><span>Cambridge General U1&amp;2</span></div><div class="colb" id="g11"></div></section>
  <section class="col"><div class="colh"><h2>Planned units</h2><span id="ustat"></span></div>
    <div class="colb"><div style="display:flex;gap:6px;margin-bottom:10px;align-items:center;flex-wrap:wrap">
      <button class="btn dark" id="addu">+ Add unit</button>
      <span class="src">Show:</span><select id="filt" class="btn"><option value="">Both streams</option><option>10MAG</option><option>10MAA</option></select></div>
      <div id="units"></div></div></section>
</div>
<div class="modal" id="modal"><div class="detail" id="detail"></div></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='10ma-units-v1', STREAMS=['10MAG','10MAA'], ASSESS=['','CAT','Topic test','CFATs only','Extension','Exam revision'];
const SECN={building_understanding:'Building understanding',fluency:'Fluency',problem_solving:'Problem-solving',reasoning:'Reasoning',enrichment:'Enrichment'};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}};
let LIB={},IDX={},UNITS=null,openChaps=new Set(JSON.parse(store.get('10ma-open')||'[]')),openUnits=new Set(),filt='';

const REPO='roccatalano/10MA',FILE='courses/units.json',API=`https://api.github.com/repos/${REPO}/contents/${FILE}`;
let dirty=false;
const b64e=s=>btoa(unescape(encodeURIComponent(s))), b64d=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
async function loadRepoUnits(){
  const tok=store.get('10ma-gh');
  if(tok){try{const r=await fetch(API+'?ref=main&t='+Date.now(),{headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'}});if(r.ok){const j=await r.json();return JSON.parse(b64d(j.content))}}catch(e){}}
  try{const r=await fetch('../'+FILE+'?t='+Date.now());if(r.ok)return r.json()}catch(e){}
  return {units:[]};
}
Promise.all([fetch('../library/C10.json').then(r=>r.json()),fetch('../library/G11.json').then(r=>r.json()),loadRepoUnits()])
.then(([c10,g11,units])=>{
  LIB={C10:c10,G11:g11};
  for(const b of [c10,g11]) if(b) for(const ch of b.chapters){ch.book=b.book.id;for(const s of ch.subchapters){s.book=b.book.id;s.chapter=ch.chapter;IDX[s.id]=s}}
  const local=store.get(KEY);
  UNITS=migrate(local?JSON.parse(local):units);dirty=!!local;
  status();renderLib();renderUnits();
});
function status(msg){const tok=store.get('10ma-gh');
  setSaved(msg||(dirty?'Unsaved changes (kept in this browser)':(tok?'All saved to GitHub':'Up to date with GitHub')));
  const b=document.getElementById('gh');b.disabled=!dirty;b.style.opacity=dirty?1:.45;}
async function saveGH(){
  let tok=store.get('10ma-gh');if(!tok){askKey();tok=store.get('10ma-gh');if(!tok)return}
  status('Saving to GitHub…');
  const H={Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'};
  try{
    let sha;const g=await fetch(API+'?ref=main&t='+Date.now(),{headers:H});if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw new Error('GitHub said '+g.status+(g.status===401?' (key wrong or expired)':''));
    const body={message:'Update unit plan from planner page',content:b64e(JSON.stringify(UNITS,null,1)+'\n'),branch:'main'};if(sha)body.sha=sha;
    const p=await fetch(API,{method:'PUT',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!p.ok){const j=await p.json().catch(()=>({}));throw new Error('GitHub said '+p.status+': '+(j.message||''))}
    try{localStorage.removeItem(KEY)}catch(_){}dirty=false;status('Saved to GitHub · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));
  }catch(e){status('Not saved: '+e.message);alert('Could not save to GitHub.\n\n'+e.message+'\n\nYour changes are still kept in this browser.')}
}
function askKey(){const cur=store.get('10ma-gh');const k=prompt('Paste your GitHub access key (fine-grained token with Contents: read and write on roccatalano/10MA).\nIt is kept only in this browser. Leave blank to remove it.',cur?'(key saved — paste a new one to replace)':'');
  if(k===null||k.startsWith('(key saved'))return;if(k.trim())store.set('10ma-gh',k.trim());else{try{localStorage.removeItem('10ma-gh')}catch(_){}}status()}
document.getElementById('gh').onclick=saveGH;document.getElementById('ghkey').onclick=askKey;
function save(){store.set(KEY,JSON.stringify(UNITS));dirty=true;status();renderUnits();renderLib()}
function setSaved(t){document.getElementById('saved').textContent=t}

function renderLib(){
  for(const [b,el] of [['C10','c10'],['G11','g11']]){
    const L=LIB[b],box=document.getElementById(el),top=box.scrollTop;
    if(!L){box.innerHTML='<p class="empty">Not loaded</p>';continue}
    box.innerHTML=L.chapters.map(ch=>chapterCard(ch,b)).join('');box.scrollTop=top;
  }
  document.querySelectorAll('.chap-h').forEach(h=>h.onclick=e=>{if(e.target.closest('.dragall'))return;const id=h.parentNode.dataset.id;openChaps.has(id)?openChaps.delete(id):openChaps.add(id);store.set('10ma-open',JSON.stringify([...openChaps]));h.parentNode.classList.toggle('open')});
  document.querySelectorAll('.sc').forEach(c=>{c.onclick=()=>showDetail(c.dataset.id);c.ondragstart=e=>e.dataTransfer.setData('text/plain',JSON.stringify({ids:[c.dataset.id]}))});
  document.querySelectorAll('.dragall').forEach(c=>c.ondragstart=e=>e.dataTransfer.setData('text/plain',JSON.stringify({ids:c.dataset.ids.split(',')})));
}
function chapterCard(ch,b){
  const s=ch.subchapters,n10=s.filter(x=>x.tenA).length,id=ch.id||`${b}-Ch${ch.chapter}`;
  const vc=(ch.vc2_codes||[]).length?`<details class="mini"><summary>Victorian Curriculum 2.0 (${ch.vc2_codes.length})</summary><ul>${ch.vc2_codes.map(c=>`<li><span class="code">${c.code}</span> ${c.tenA?'<span class="tag t10a">10A</span> ':''}${c.level==='9'?'<span class="tag">L9 review</span> ':''}${esc(c.text)}</li>`).join('')}</ul></details>`:'';
  const rs=(ch.chapter_resources||[]).length?`<details class="mini"><summary>Chapter resources (${ch.chapter_resources.length})</summary><ul>${ch.chapter_resources.map(r=>`<li>${esc(r.name)} <span class="src">p. ${r.printed_page}</span></li>`).join('')}</ul></details>`:'';
  const pg=s.length?`pp. ${s[0].printed_page}–${s[s.length-1].printed_end}`:'';
  return `<div class="chap ${b} ${openChaps.has(id)?'open':''}" data-id="${id}">
   <div class="chap-h"><span class="caret">▸</span><div class="t"><b>${ch.chapter} · ${esc(ch.title)}</b>
   <div class="m">${s.length} subchapters${n10?` · ${n10} ${n10===1?'is':'are'} 10A`:''} · ${pg} ${ch.status==='full'?'· <span class="tag tfull">full detail</span>':''}</div></div>
   <span class="dragall" draggable="true" data-ids="${s.map(x=>x.id).join(',')}" title="Drag the whole chapter into a unit">⠿ all</span></div>
   <div class="chap-b">${vc}${rs}${s.map(subCard).join('')}</div></div>`;
}
function subCard(x){
  const u=usedIn(x.id);
  return `<div class="sc ${x.tenA?'is10a':''}" draggable="true" data-id="${x.id}" style="--bk:${x.book==='G11'?'var(--g11)':'var(--lesson-i)'}">
   <span class="id">${x.sub}</span><span class="tt">${esc(x.title)}</span>
   ${x.tenA?'<span class="tag t10a">10A</span>':''}${x.consolidating?'<span class="tag tcons">Cons.</span>':''}${x.extension?'<span class="tag text">Ext.</span>':''}
   ${u.length?`<span class="used" title="Used in: ${u.join(', ')} (G = 10MAG, A = 10MAA)">${u.join(' ')}</span>`:''}</div>`;
}

/* ---------- units: each unit has a 10MAG and/or 10MAA version ---------- */
function migrate(D){
  (D.units||[]).forEach(u=>{
    if(!u.versions){u.versions={};(u.streams||STREAMS).forEach(s=>u.versions[s]={lessons:u.lessons??null,items:(u.items||[]).map(x=>({id:x.id}))});delete u.streams;delete u.items;delete u.lessons}
    if('assessment' in u){STREAMS.forEach(s=>{const v=u.versions[s];if(v&&v.assessment===undefined)v.assessment=u.assessment||''});delete u.assessment}
  });return D;
}
function usedIn(id){const r=[];UNITS.units.forEach((u,i)=>STREAMS.forEach(s=>{const v=u.versions[s];if(v&&v.items.some(x=>x.id===id))r.push(`U${i+1}${s==='10MAG'?'G':'A'}`)}));return r}
function renderUnits(){
  const box=document.getElementById('units');
  const tot=s=>UNITS.units.reduce((a,u)=>a+(+(u.versions[s]||{}).lessons||0),0);
  document.getElementById('ustat').textContent=`${UNITS.units.length} units · 10MAG ${tot('10MAG')} · 10MAA ${tot('10MAA')} × 79-min lessons`;
  box.innerHTML=UNITS.units.map((u,i)=>unitCard(u,i)).join('')||'<p class="empty">No units yet: add one, then drag subchapters in.</p>';
  box.querySelectorAll('.unit').forEach(el=>{
    const i=+el.dataset.i,u=UNITS.units[i];
    el.querySelector('.name').onchange=e=>{u.name=e.target.value;save()};
    const n=el.querySelector('.note');if(n)n.onchange=e=>{u.note=e.target.value;save()};
    el.querySelector('.del').onclick=()=>{if(confirm(`Delete unit "${u.name}"? Its subchapters go back to the library.`)){UNITS.units.splice(i,1);openUnits.clear();save()}};
    el.querySelector('.up').onclick=()=>{if(i>0){[UNITS.units[i-1],UNITS.units[i]]=[UNITS.units[i],UNITS.units[i-1]];openUnits.clear();save()}};
    el.querySelector('.dn').onclick=()=>{if(i<UNITS.units.length-1){[UNITS.units[i+1],UNITS.units[i]]=[UNITS.units[i],UNITS.units[i+1]];openUnits.clear();save()}};
    el.querySelector('.tog').onclick=e=>{e.preventDefault();openUnits.has(i)?openUnits.delete(i):openUnits.add(i);renderUnits()};
    el.querySelectorAll('.addv').forEach(b=>b.onclick=()=>{u.versions[b.dataset.s]={lessons:null,assessment:'',items:[]};save()});
    el.querySelectorAll('.ver:not(.off)').forEach(V=>{
      const s=V.dataset.s,v=u.versions[s],other=STREAMS.find(x=>x!==s);
      V.ondragover=e=>{e.preventDefault();V.classList.add('over')};
      V.ondragleave=e=>{if(!V.contains(e.relatedTarget))V.classList.remove('over')};
      V.ondrop=e=>{e.preventDefault();V.classList.remove('over');let d;try{d=JSON.parse(e.dataTransfer.getData('text/plain'))}catch(_){return}
        if(d.from!=null){if(d.from===i&&d.s===s)return;const src=UNITS.units[d.from].versions[d.s];const it=src.items[d.idx];
          if(!v.items.some(x=>x.id===it.id))v.items.push({id:it.id});
          if(!(e.ctrlKey||e.metaKey||e.altKey)&&!(d.from===i))src.items.splice(d.idx,1); }
        else d.ids.forEach(id=>{if(!v.items.some(x=>x.id===id))v.items.push({id})});
        save()};
      V.querySelector('.assess').onchange=e=>{v.assessment=e.target.value;save()};
      V.querySelector('.les').onchange=e=>{v.lessons=e.target.value===''?null:Math.max(0,+e.target.value||0);save()};
      V.querySelector('.offv').onclick=()=>{if(confirm(`Remove the ${s} version of "${u.name}"?`)){delete u.versions[s];save()}};
      const cp=V.querySelector('.copyv');if(cp)cp.onclick=()=>{const o=u.versions[other];if(!o)return;v.items.forEach(x=>{if(!o.items.some(y=>y.id===x.id))o.items.push({id:x.id})});save()};
      V.querySelectorAll('.ui').forEach(r=>{const k=+r.dataset.k;
        r.querySelector('.x').onclick=()=>{v.items.splice(k,1);save()};
        r.querySelector('.tt').onclick=()=>showDetail(v.items[k].id);
        r.ondragstart=e=>e.dataTransfer.setData('text/plain',JSON.stringify({from:i,s,idx:k}));
        r.ondrop=e=>{let d;try{d=JSON.parse(e.dataTransfer.getData('text/plain'))}catch(_){return}
          if(d.from===i&&d.s===s){e.preventDefault();e.stopPropagation();V.classList.remove('over');const it=v.items.splice(d.idx,1)[0];v.items.splice(k,0,it);save()}};
      });
    });
  });
}
function verCol(u,i,s){
  const v=u.versions[s],other=STREAMS.find(x=>x!==s);
  if(!v)return `<div class="ver off"><button class="btn addv" data-s="${s}">+ ${s} version</button></div>`;
  const ids=new Set((u.versions[other]||{items:[]}).items.map(x=>x.id));
  const items=v.items.map(x=>({...x,s:IDX[x.id]}));
  const L=+v.lessons||0;
  return `<div class="ver" data-s="${s}">
   <div class="vh"><b>${s}</b><select class="assess" title="${s} assessment for this unit">${ASSESS.map(x=>`<option ${x===(v.assessment||'')?'selected':''} value="${x}">${x||'Assessment…'}</option>`).join('')}</select><label class="lesbox" title="Number of 79-minute lessons for the ${s} version"><input class="les" type="number" min="0" value="${v.lessons??''}" placeholder="?"> lessons</label>
    ${u.versions[other]?`<button class="x copyv" title="Copy these subchapters to the ${other} version">⇄</button>`:''}<button class="x offv" title="Remove the ${s} version">✕</button></div>
   ${items.map((x,k)=>`<div class="ui ${x.id.split('-')[0]} ${u.versions[other]&&!ids.has(x.id)?'only':''}" draggable="true" data-k="${k}" title="${u.versions[other]&&!ids.has(x.id)?s+' only':''}"><span class="id">${x.id.replace(/^C10-|^G11-/,m=>m==='G11-'?'Y11 ':'')}</span><span class="tt">${esc(x.s?x.s.title:'(not in library)')}${x.s&&x.s.tenA?' <span class="tag t10a">10A</span>':''}</span><button class="x" title="Remove">✕</button></div>`).join('')}
   <div class="drop">Drop here</div>
   <div class="vfoot">${items.length} subch.${items.length&&L?` · ≈${(L/items.length).toFixed(1)} les. each`:''}</div></div>`;
}
function unitCard(u,i){
  if(filt&&!u.versions[filt])return '';
  const open=openUnits.has(i);
  const all=new Map();STREAMS.forEach(s=>(u.versions[s]||{items:[]}).items.forEach(x=>all.set(x.id,IDX[x.id])));
  const codes=new Map(),chs=new Map();
  [...all.values()].forEach(x=>{if(!x)return;(x.vc2||[]).forEach(c=>codes.set(c.code,c));const k=x.book+' Ch'+x.chapter;chs.set(k,(chs.get(k)||0)+1)});
  const g=u.versions['10MAG'],a=u.versions['10MAA'];
  const onlyA=a&&g?a.items.filter(x=>!g.items.some(y=>y.id===x.id)).length:0, onlyG=a&&g?g.items.filter(x=>!a.items.some(y=>y.id===x.id)).length:0;
  const info=open?`<div class="uinfo">
   <details class="mini" open><summary>Unit summary</summary><ul>
    ${STREAMS.map(s=>u.versions[s]?`<li><b>${s}</b>: ${u.versions[s].lessons??'?'} × 79-min lessons · ${esc(u.versions[s].assessment||'no assessment set')} · ${u.versions[s].items.length} subchapters · ${u.versions[s].items.filter(x=>IDX[x.id]&&IDX[x.id].tenA).length} are 10A</li>`:`<li><b>${s}</b>: does not do this unit</li>`).join('')}
    ${g&&a?`<li>Shared: ${a.items.length-onlyA} · 10MAA only: ${onlyA} · 10MAG only: ${onlyG}</li>`:''}
    <li>From: ${[...chs].map(([k,n])=>`${k} (${n})`).join(', ')||'nothing yet'}</li>
    <li><input class="note" placeholder="Notes for this unit…" value="${esc(u.note||'')}" style="width:100%;border:1px solid var(--line);border-radius:6px;padding:3px 6px"></li></ul></details>
   ${codes.size?`<details class="mini"><summary>VC2 covered (${codes.size}, from fully-detailed subchapters)</summary><ul>${[...codes.values()].map(c=>`<li><span class="code">${c.code}</span> ${c.tenA?'<span class="tag t10a">10A</span> ':''}${esc(c.text)}</li>`).join('')}</ul></details>`:''}
  </div>`:'';
  const cols=filt?verCol(u,i,filt):STREAMS.map(s=>verCol(u,i,s)).join('');
  return `<div class="unit" data-i="${i}">
   <div class="uh"><span class="num">U${i+1}</span><input class="name" value="${esc(u.name)}">
    <button class="x up" title="Move up">↑</button><button class="x dn" title="Move down">↓</button><button class="x del" title="Delete unit">✕</button></div>
   <div class="ub"><div class="vers ${filt?'one':''}">${cols}</div>
    <div class="utot"><a href="#" class="tog">${open?'Hide info':'Show unit info'}</a></div>${info}</div></div>`;
}
document.getElementById('addu').onclick=()=>{UNITS.units.push({name:'New unit',assessment:'',note:'',versions:{'10MAG':{lessons:null,assessment:'',items:[]},'10MAA':{lessons:null,assessment:'',items:[]}}});openUnits.add(UNITS.units.length-1);save();const b=document.getElementById('units');b.lastElementChild&&b.lastElementChild.scrollIntoView({behavior:'smooth'})};
document.getElementById('filt').onchange=e=>{filt=e.target.value;renderUnits()};
document.getElementById('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(UNITS,null,1)],{type:'application/json'}));a.download='units.json';a.click()};
document.getElementById('imp').onclick=()=>document.getElementById('impf').click();
document.getElementById('impf').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{UNITS=migrate(JSON.parse(t));save()}catch(_){alert('That file is not a units.json')}})};
document.getElementById('reset').onclick=()=>{if(confirm('Throw away your unsaved changes and reload the version saved on GitHub?')){try{localStorage.removeItem(KEY)}catch(_){}location.reload()}};

const modal=document.getElementById('modal');
modal.onclick=e=>{if(e.target===modal)modal.classList.remove('on')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('on')});
function showDetail(id){
  const x=IDX[id];if(!x)return;
  const li=a=>a&&a.length?'<ul>'+a.join('')+'</ul>':'<p class="empty">Not filled yet</p>';
  const S=(n,t,body,wide)=>`<div class="sec ${wide?'wide':''}"><h3><span class="step">${n}</span>${t}</h3>${body}</div>`;
  const full=x.status==='indexed'||x.status==='full', u=usedIn(id);
  let h=`<button class="btn close" onclick="modal.classList.remove('on')">Close</button>
   <h2>${x.sub} ${esc(x.title)} ${x.tenA?'<span class="tag t10a">10A</span>':''}${x.extension?'<span class="tag text">Extension</span>':''}</h2>
   <div class="sub">${x.id} · ${x.book==='C10'?'Cambridge 10 &amp; 10A':'Cambridge General U1&amp;2'} pp. ${x.printed_page}–${x.printed_end} (PDF ${x.pdf_page}–${x.pdf_end})${u.length?` · in ${u.join(', ')}`:''}${full?'':' · <b>basic index only</b>: the lesson-plan fields get filled when this chapter is done'}</div><div class="flow">`;
  h+=S(1,'Learning intentions',li((x.learning_intentions||[]).map(t=>`<li>${esc(t)}</li>`)));
  h+=S(2,'Victorian Curriculum 2.0',li((x.vc2||[]).map(c=>`<li><span class="code">${c.code}</span> ${c.tenA?'<span class="tag t10a">10A</span> ':''}${c.level==='9'?'<span class="tag">L9 review</span> ':''}${esc(c.text)}</li>`)));
  h+=S(3,'Do Now (retrieval)',li((x.do_now||[]).map(d=>`<li><span class="slot">${esc(d.slot)}</span> · ${esc(d.sub)}: ${esc(d.src)} Q${d.q} <span class="src">(${d.printed_page?'p. '+d.printed_page:'PDF p. '+d.pdf_page})${d.note?' · '+esc(d.note):''}</span></li>`)));
  h+=S(4,'APK (priming: Year 7 → 8 → 9)',li((x.apk||[]).map(a=>`<li><b>${esc(a.book)}</b> ${esc(a.skill)}<br><span class="src">e.g. <span class="loc">${esc(a.question_locator)}</span> · ${esc(a.src)} #${a.n} (${a.sub}), PDF p. ${a.pdf_page}</span></li>`)));
  h+=S(5,'Key vocabulary',(x.key_vocab||[]).length?`<div class="vocab">${x.key_vocab.map(v=>`<span>${esc(v)}</span>`).join('')}</div><p class="src">${esc(x.key_vocab_note)}</p>`:'<p class="empty">Not filled yet</p>');
  h+=S(6,'Self-study videos',li((x.videos||[]).map(v=>`<li><a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.title)}</a></li>`)));
  h+=S(7,'Worked examples → Now you try',li((x.examples||[]).map(e=>`<li><b>Example ${e.n}</b> ${esc(e.title)}${e.now_you_try?' <span class="tag tfull">+ Now you try</span>':''}</li>`)));
  h+=S(8,'Exercise '+x.sub,li((x.exercise||[]).map(e=>`<li><b>${SECN[e.section]||e.section}</b>${e.title?' · '+esc(e.title):''} Q${esc(e.q)}${e.pathways?` <span class="src">(pathways: ${e.pathways.map(esc).join(' | ')})</span>`:''}</li>`)));
  h+=S(9,'Exit tasks (skills checklist questions)',li((x.exit_tasks||[]).map(e=>`<li>☐ ${esc(e.skill)}<br><span class="src">e.g. <span class="loc">${esc(e.question_locator)}</span> · checklist #${e.n}, p. ${e.printed_page}</span></li>`)),true);
  h+=S(10,'Success criteria (end-of-lesson skills checklist)',li((x.success_criteria||[]).map(s=>`<li>☐ ${esc(s.text)}</li>`)),true);
  document.getElementById('detail').innerHTML=h+'</div>';
  modal.classList.add('on');
}
</script>
</body>
