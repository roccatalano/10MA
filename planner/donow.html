<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Do Now sheets</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="donow.js"></script>
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;font-size:11pt;line-height:1.35;color:#000}
.katex{font-size:1.08em}
.sheet{width:210mm;height:297mm;padding:0;page-break-after:always;break-after:page;display:flex;flex-direction:column;background:#fff}
.half{height:148.5mm;padding:9mm 12mm 6mm;display:flex;flex-direction:column;overflow:hidden}
.half+.half{border-top:1px dashed #888}
.hd{display:flex;align-items:center;gap:4mm;border:2px solid #000;padding:1.5mm 3mm;margin-bottom:3mm}
.hd .t{font-size:15pt;font-weight:bold;border-right:2px solid #000;padding-right:3mm}
.hd .u{flex:1;font-size:10pt}.hd .u b{font-size:11pt}
.hd .nm{font-size:10pt;white-space:nowrap}
.q{display:flex;gap:2.5mm;flex:1;min-height:0;border-bottom:1px solid #ddd;padding-top:1.5mm}.q:last-of-type{border-bottom:0}
.q>b{min-width:5mm}.q .st{margin:0 0 1mm}
.mc{display:grid;grid-template-columns:repeat(3,auto);gap:1.5mm 6mm;justify-content:start;margin-top:1.5mm}
.src{font-size:8pt;color:#444;margin-top:1mm}
.none{font-style:italic;color:#444;margin-top:4mm}
@media screen{html{background:#8a8a8a}body{padding:8mm 0}.sheet{margin:0 auto 8mm;box-shadow:0 2px 14px rgba(0,0,0,.45)}
 .bar{position:sticky;top:0;z-index:2;background:#222;color:#fff;font:13px system-ui;padding:8px 14px;margin:-8mm 0 8mm;display:flex;gap:12px;align-items:center}
 .bar button{font:inherit;border:0;border-radius:6px;padding:4px 10px;cursor:pointer}}
@media print{.bar{display:none}}
</style></head><body>
<div class="bar"><span id="info">Loading…</span><button onclick="print()">Print</button></div>
<div id="out"></div>
<script>
const P=new URLSearchParams(location.search),S=P.get('s')||'10MAA',U=+P.get('u')||1,L=P.get('l')?+P.get('l'):null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const j=u=>fetch(u+'?t='+Date.now()).then(r=>r.json());
Promise.all([j('../library/C10.json'),j('../library/G11.json'),j('../courses/units.json'),j('../courses/lessons.json')]).then(([c10,g11,units,lp])=>{
  const IDX={};for(const b of [c10,g11])for(const ch of b.chapters)for(const s of ch.subchapters)IDX[s.id]=s;
  if(ls('10ma-units-v1'))units=JSON.parse(ls('10ma-units-v1'));if(ls('10ma-lessons-v1'))lp=JSON.parse(ls('10ma-lessons-v1'));
  const D=DN.doNows(S,units,lp,IDX),us=units.units.filter(u=>u.stream===S),u=us[U-1];
  if(!u){document.getElementById('info').textContent='No such unit';return}
  const tag=(S==='10MAA'?'A':'G')+U,plan=DN.planFor(u,lp);let n=0;const pages=[];
  plan.forEach((l,li)=>{const ln=li+1,d=D[(U-1)+'|'+li];if(!d||(L&&ln!==L))return;
    const body=d.items.length?d.items.map((q,k)=>`<div class="q"><b>${k+1}.</b><div>${q.stem?`<p class="st">${q.stem}</p>`:''}${q.tex?`<div>${q.tex}</div>`:''}</div></div>`).join('')
      +`<div class="src">Cambridge Essential Mathematics 10 &amp; 10A 3rd Ed: ${d.items.map(q=>esc(q.src.replace('C10 Ch1 ','Ch1 '))+' (p. '+q.page+')').join('; ')}</div>`
      :'<p class="none">Nothing has been taught yet this year. Use the Activating prior knowledge questions on the worksheet.</p>';
    const half=`<div class="half"><div class="hd"><span class="t">Do Now</span><span class="u"><b>${S} ${tag} · Lesson ${ln}</b><br>${esc(u.name)}</span><span class="nm">Name: ____________________</span></div>${body}</div>`;
    pages.push(`<div class="sheet">${half}${half}</div>`);n++});
  document.getElementById('out').innerHTML=pages.join('')||'<p style="color:#fff">No Do Now for that lesson (review / assessment lessons have none).</p>';
  document.getElementById('info').textContent=`${S} ${tag} ${u.name} · ${n} Do Now sheet${n===1?'':'s'} (2 copies per A4, cut on the dashed line)`;
  renderMathInElement(document.body,{delimiters:[{left:'$',right:'$',display:false}],throwOnError:false});
});
</script></body></html>
